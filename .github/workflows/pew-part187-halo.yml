name: PEW part187 halo du noeud wk_T0 (relaxation float64 a L=32, 48, 64 et mesure)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  halo:
    name: part187 ${{ matrix.tag }}
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        include:
          # N * h = L ; h = 0.5 (comme wk_T0). maxit adapte au cout par iteration (N=64 : ~1 s, N=96 : ~3 s, N=128 : ~8 s sur 2 coeurs).
          - {tag: L32_N64,  n: '64',  maxit: '600',  save: '100'}
          - {tag: L48_N96,  n: '96',  maxit: '2500', save: '250'}
          - {tag: L64_N128, n: '128', maxit: '1500', save: '150'}
    defaults:
      run:
        working-directory: numerical_minimization/protect3d_Z
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: numerical_minimization/protect3d_Z/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt "scipy>=1.15"
      - name: Tests du code de mesure (champs analytiques)
        run: python test_halo.py
      - name: Mesure du champ de depart (wk_T0, float16, L=32)
        run: |
          python halo_mesure.py ../../resultats/part179/wk_T0/wk_T0_champ_final.npy --h 0.5 --mu 0.375 --e0 0.25 --d2 1e-3 \
            --tag wk_T0_depart --ref 319.47,527.94,28.88 --out halo_wk_T0_depart.json | tee halo_wk_T0_depart.log
      - name: Relaxation (float64, L-BFGS-B) depuis wk_T0 place au centre d'une boite N^3
        run: |
          python halo_relax.py --in ../../resultats/part179/wk_T0/wk_T0_champ_final.npy --N ${{ matrix.n }} --h 0.5 --mu 0.375 --e0 0.25 --d2 1e-3 \
            --maxit ${{ matrix.maxit }} --save ${{ matrix.save }} --out relaxe_${{ matrix.tag }}.npy | tee relaxe_${{ matrix.tag }}.log
      - name: Mesure du halo (champ relaxe, ou dernier point de reprise si la relaxation a ete interrompue)
        if: always()
        run: |
          python halo_mesure.py relaxe_${{ matrix.tag }}.npy --h 0.5 --mu 0.375 --e0 0.25 --d2 1e-3 \
            --tag ${{ matrix.tag }} --out halo_${{ matrix.tag }}.json | tee halo_${{ matrix.tag }}.log
      - name: Champ relaxe en artefact (pas dans le depot, 4 a 33 Mo par champ)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: champ_relaxe_${{ matrix.tag }}
          path: numerical_minimization/protect3d_Z/relaxe_${{ matrix.tag }}.npy
          retention-days: 30
      - name: Archive journaux et mesures dans resultats/part187
        if: always()
        working-directory: .
        run: |
          mkdir -p resultats/part187
          cp numerical_minimization/protect3d_Z/relaxe_${{ matrix.tag }}.log numerical_minimization/protect3d_Z/halo_${{ matrix.tag }}.log numerical_minimization/protect3d_Z/halo_${{ matrix.tag }}.json resultats/part187/ || true
          cp numerical_minimization/protect3d_Z/halo_wk_T0_depart.log numerical_minimization/protect3d_Z/halo_wk_T0_depart.json resultats/part187/ || true
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add resultats/part187
          git commit -m "part187 halo ${{ matrix.tag }} : journaux et mesures

          Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_012qTVdDvagm9nsLTXYZ7x2G" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && break || sleep $((RANDOM % 20 + 5)); done
