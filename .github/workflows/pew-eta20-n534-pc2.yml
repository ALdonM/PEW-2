            numerical_minimization/eta20_N534pc2/dchi_free_eta20_N534pc2_ckpt.npy
            numerical_minimization/eta20_N534pc2/free_eta20_N534pc2_state.json
            numerical_minimization/eta20_N534pc2/free_eta20_N534pc2_history.jsonl
          key: pew-eta20-n534pc2-${{ github.run_id }}-${{ github.run_attempt }}-chunk-08
          restore-keys: |
            pew-eta20-n534pc2-

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run or resume minimization
        env:
          JAX_PLATFORM_NAME: cpu
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '1'
          MAXITER: '50000'
          PC: '1'
          PC_ETA0: '8.0'
          PC2: '1'
          PC2_FLOOR: '1e-3'
          PC2_REF: 'ref_f20_n534.npy'
          TOTAL_MAXITER: '400000'
          CHECKPOINT_EVERY: '10000'
        run: python -u free_ar.py 20 534 start20n534 eta20_N534pc2 | tee run.log

      - name: Check whether the global iteration limit was reached
        id: check_done
        shell: bash
        env:
          TOTAL_MAXITER: '400000'
        run: |
          python - <<'PYCODE'
          import json, os
          with open("free_eta20_N534pc2_state.json", encoding="utf-8") as f:
              state = json.load(f)
          nit = int(state["nit_ckpt"])
          limit = int(os.environ["TOTAL_MAXITER"])
          finished = nit >= limit
          print(f"Checkpoint cumulatif : {nit} / {limit}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"finished={'true' if finished else 'false'}\n")
          PYCODE

      - name: Preserve checkpoint and history artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PEW-eta20-N534pc2-checkpoint-chunk-08
          path: |
            numerical_minimization/eta20_N534pc2/free_eta20_N534pc2_checkpoint.npz
            numerical_minimization/eta20_N534pc2/*ckpt.npy
            numerical_minimization/eta20_N534pc2/*state.json
            numerical_minimization/eta20_N534pc2/*history.jsonl
            numerical_minimization/eta20_N534pc2/run.log
            numerical_minimization/eta20_N534pc2/LISEZMOI.txt
          if-no-files-found: warn
          retention-days: 30
