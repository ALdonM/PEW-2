name: PEW part184 paires (Q, J) - modele Z masse et jauge U(1) sur Z2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  paires:
    name: part184 ${{ matrix.tag }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - {tag: A_Qopp_Jopp,   sq: opp,  sj: opp,  nu: '0.12', om: '0.08', dt: '0.02'}
          - {tag: B_Qopp_Jsame,  sq: opp,  sj: same, nu: '0.12', om: '0.08', dt: '0.02'}
          - {tag: C_Qsame_Jopp,  sq: same, sj: opp,  nu: '0.12', om: '0.08', dt: '0.02'}
          - {tag: D_Qsame_Jsame, sq: same, sj: same, nu: '0.12', om: '0.08', dt: '0.02'}
          - {tag: D2_Qsame_Jsame_dt01, sq: same, sj: same, nu: '0.12', om: '0.08', dt: '0.01'}
          - {tag: D3_Qsame_Jsame_nu008, sq: same, sj: same, nu: '0.08', om: '0.05', dt: '0.02'}
    defaults:
      run:
        working-directory: numerical_minimization/protect3d_Z
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: numerical_minimization/protect3d_Z/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt scipy
      - name: Relaxe un noeud isole (N=48)
        env:
          N: '48'
        run: python jauge.py relax ${{ matrix.nu }} relaxed.npy
      - name: Paire (N=80, T=14)
        env:
          N: '80'
          RELAXED: relaxed.npy
          DT: ${{ matrix.dt }}
        run: python jauge.py pair ${{ matrix.nu }} 0.005 ${{ matrix.om }} 14 ${{ matrix.tag }} ${{ matrix.sq }} ${{ matrix.sj }} | tee ${{ matrix.tag }}.log
      - name: Archive le journal dans resultats/part184
        if: always()
        working-directory: .
        run: |
          mkdir -p resultats/part184/gh
          cp numerical_minimization/protect3d_Z/${{ matrix.tag }}.log resultats/part184/gh/ || true
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add resultats/part184/gh
          git commit -m "part184 paire ${{ matrix.tag }} : journal

          Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_012qTVdBcwjjMSGxvefBTrWg" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && break || sleep $((RANDOM % 20 + 5)); done
