name: PEW part210 etape 4 - test dt du Stormer-Verlet generalise sur paire jaugee qui s'annihile

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dt004:
    name: part210 test dt 0.04
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    defaults:
      run:
        working-directory: numerical_minimization/protect3d_Z
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: numerical_minimization/protect3d_Z/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt scipy
      - name: Depart
        run: python make_pairG210.py pairG64.npy 16 1
      - name: Run
        env:
          N: '64'
          H: '0.5'
          NU: '0.12'
          G2: '0.02'
          KF: '1'
          DT: '0.04'
          T_END: '4'
          MEAS: '0.25'
          SCHEME: sv
          INIT_FILE: pairG64.npy
          TIME_BUDGET: '18900'
          JAX_PLATFORM_NAME: cpu
          OMP_NUM_THREADS: '4'
        run: python -u dynG210.py dtG_0.04 2>&1 | tee run_dtG_0.04.log
      - name: Commit results
        if: always()
        shell: bash
        run: |
          OUT=../../resultats/part210/dtG_0.04; mkdir -p $OUT
          cp dtG_0.04_history.jsonl dtG_0.04_state.json dtG_0.04_champ_final.npy run_dtG_0.04.log $OUT/ || true
          cd ../..; git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resultats/part210/dtG_0.04; git commit -q -m 'part210 test dt 0.04 : resultats' || exit 0
          ok=0; for i in $(seq 1 20); do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && ok=1 && break; git rebase --abort 2>/dev/null; sleep $((RANDOM % 30 + 5)); done
          test $ok = 1
