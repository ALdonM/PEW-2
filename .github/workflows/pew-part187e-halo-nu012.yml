name: PEW part187e halo du noeud a nu=0.12 (masse des modes charges, parametres des paires part184) : L=32, 48, 64

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  halo:
    name: part187e ${{ matrix.tag }}
    runs-on: ubuntu-24.04
    timeout-minutes: 358
    strategy:
      fail-fast: false
      matrix:
        include:
          - {tag: nu012_L32_N64,  n: '64',  maxit: '1500', save: '150', tmax: '19000'}
          - {tag: nu012_L48_N96,  n: '96',  maxit: '3000', save: '250', tmax: '19000'}
          - {tag: nu012_L64_N128, n: '128', maxit: '3000', save: '150', tmax: '19000'}
    defaults:
      run:
        shell: bash
        working-directory: numerical_minimization/protect3d_Z
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: numerical_minimization/protect3d_Z/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt "scipy>=1.15"
      - name: Tests du code de mesure
        run: python test_halo.py
      - name: Relaxation (float64, L-BFGS-B, nu=0.12) depuis wk_T0 place au centre d'une boite N^3
        run: |
          python halo_relax.py --in ../../resultats/part179/wk_T0/wk_T0_champ_final.npy --N ${{ matrix.n }} --h 0.5 --mu 0.375 --e0 0.25 --d2 1e-3 --nu 0.12 \
            --maxit ${{ matrix.maxit }} --save ${{ matrix.save }} --tmax ${{ matrix.tmax }} --out relaxe_${{ matrix.tag }}.npy | tee relaxe_${{ matrix.tag }}.log
      - name: Mesure du halo et ventilation par composante
        if: always()
        run: |
          python halo_mesure.py relaxe_${{ matrix.tag }}.npy --h 0.5 --mu 0.375 --e0 0.25 --d2 1e-3 --nu 0.12 --tag ${{ matrix.tag }} --out halo_${{ matrix.tag }}.json | tee halo_${{ matrix.tag }}.log
          python halo_composantes.py relaxe_${{ matrix.tag }}.npy --h 0.5 --nu 0.12 --tag ${{ matrix.tag }} --out comp_${{ matrix.tag }}.json | tee comp_${{ matrix.tag }}.log
      - name: Champ relaxe en artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: champ_relaxe_${{ matrix.tag }}
          path: numerical_minimization/protect3d_Z/relaxe_${{ matrix.tag }}.npy
          retention-days: 30
      - name: Archive dans resultats/part187
        if: always()
        working-directory: numerical_minimization/protect3d_Z
        run: |
          mkdir -p ../../resultats/part187
          cp relaxe_${{ matrix.tag }}.log halo_${{ matrix.tag }}.* comp_${{ matrix.tag }}.* ../../resultats/part187/
          cd ../..
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add resultats/part187
          if git diff --cached --quiet; then echo "rien a archiver"; exit 0; fi
          git commit -m "part187e halo nu=0.12 ${{ matrix.tag }} : journaux et mesures

          Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_012qTVdDvagm9nsLTXYZ7x2G"
          ok=0
          for i in 1 2 3 4 5 6; do
            if git pull --rebase origin main && git push origin HEAD:main; then ok=1; break; fi
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 20 + 5))
          done
          if [ "$ok" != 1 ]; then echo "ECHEC du push apres 6 essais"; exit 1; fi
