name: PEW part177 refroidissement du chaos et naissance des noeuds

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  g002_s1:
    name: part177 g002_s1
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    defaults:
      run:
        working-directory: numerical_minimization/protect3d_Z
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: numerical_minimization/protect3d_Z/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run
        env:
          N: '64'
          H: '0.5'
          E0: '0.25'
          MU: '0.375'
          T0: '10'
          T_END: '60'
          DT: '0.0025'
          MEAS: '0.5'
          SNAP: '1000'
          TIME_BUDGET: '19800'
          JAX_PLATFORM_NAME: 'cpu'
          OMP_NUM_THREADS: '4'
          INIT: 'chaos'
          XI0: '2.0'
          RMS: '2.0'
          BARRIER: '0'
          NOEUDS: '1'
          G0: '0.02'
          MODE: 'none'
          SEED: '1'
        run: python -u dyn.py g002_s1 2>&1 | tee run_g002_s1.log
      - name: Commit results to resultats/
        if: always()
        shell: bash
        run: |
          OUT=../../resultats/part177/g002_s1; mkdir -p $OUT
          cp g002_s1_history.jsonl g002_s1_params.json g002_s1_state.json g002_s1_champ_final.npy $OUT/ 2>/dev/null || true
          cd ../..; git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resultats/part177/g002_s1; git commit -q -m 'part177 g002_s1 : resultats' || exit 0
          for i in $(seq 1 12); do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep $((RANDOM % 30 + 5)); done
