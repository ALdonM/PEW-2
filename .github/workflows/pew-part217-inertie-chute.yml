name: PEW part217 inertie des noeuds Q_H=1 2 3 et chute dans une pente d amplitude de fond

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  inertie_Q1:
    name: part217 inertie Q1
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: numerical_minimization/protect3d_Z
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: numerical_minimization/protect3d_Z/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt scipy
      - name: Noeud relaxe en boite 64
        uses: actions/download-artifact@v4
        with:
          name: champ_relaxe_Q1_nu0_L64
          run-id: 45895033007
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: numerical_minimization/protect3d_Z/depart
      - name: Tenseur d inertie et couplage
        run: python inertie_noeud.py depart/relaxe_Q1_nu0_L64.npy --tag Q1_L64 --out inertie_Q1_L64.json | tee inertie_Q1_L64.log
      - name: Archive
        if: always()
        shell: bash
        run: |
          mkdir -p ../../resultats/part217; cp inertie_Q1_L64.* ../../resultats/part217/ || true
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cd ../..
          git add resultats/part217; git commit -q -m 'part217 inertie Q1

          Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_012qTVdE7fweMvxDdweHMqCg' || exit 0
          ok=0; for i in $(seq 1 20); do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && ok=1 && break; git rebase --abort 2>/dev/null; sleep $((RANDOM % 30 + 5)); done
          test $ok = 1
