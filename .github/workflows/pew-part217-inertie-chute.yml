        run: python -c "import numpy as np; np.save('init96.npy', np.load('depart/relaxe_L48_N96.npy').astype(np.float32))"
      - name: Run
        env:
          N: '96'
          NB: '96'
          H: '0.5'
          E0: '0.25'
          DT: '0.005'
          T0: '0'
          MODE: 'hot'
          TC0: '1000000'
          TH: '0'
          TC: '0'
          TSTART_H: '0'
          G0: '0'
          WARM: '0'
          MU: '0.375'
          MEAS: '2.0'
          SNAP: '1000'
          TIME_BUDGET: '18900'
          JAX_PLATFORM_NAME: 'cpu'
          OMP_NUM_THREADS: '4'
          BARRIER: '0'
          NOEUDS: '0'
          KC: '0'
          SEED: '1'
          FINAL32: '1'
          CP: '0'
          MEANC: '0'
          SPR0: '18'
          SPRB: '24'
          SPSIG: '0.3'
          KW0: '1'
          WA: '1'
          WR: '1'
          WV: '1'
          KT: '1'
          KF: '1'
          NU: '0'
          GRAD: '0'
          T_END: '24'
          GRADA: '0.02'
          INIT: 'file'
          INIT_FILE: 'init96.npy'
        run: python -u dyn186c.py p217_Q1_g020 2>&1 | tee run_p217_Q1_g020.log
      - name: Archive
