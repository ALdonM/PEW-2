name: PEW eta16 N320 PRECOND long minimization (a_r free)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  chunk01:
    name: PEW eta16 N320 PRECOND chunk 01/10
    runs-on: ubuntu-latest
    timeout-minutes: 330
    outputs:
      finished: ${{ steps.check_done.outputs.finished }}
    defaults:
      run:
        working-directory: numerical_minimization/eta16_N320pc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: numerical_minimization/eta16_N320pc/requirements.txt

      - name: Restore latest checkpoint and history
        uses: actions/cache@v4
        with:
          path: |
            numerical_minimization/eta16_N320pc/free_eta16_N320pcpc_checkpoint.npz
            numerical_minimization/eta16_N320pc/f_free_eta16_N320pcpc_ckpt.npy
            numerical_minimization/eta16_N320pc/dchi_free_eta16_N320pcpc_ckpt.npy
            numerical_minimization/eta16_N320pc/free_eta16_N320pcpc_state.json
            numerical_minimization/eta16_N320pc/free_eta16_N320pcpc_history.jsonl
          key: pew-eta16-n320pc-${{ github.run_id }}-${{ github.run_attempt }}-chunk-01
          restore-keys: |
            pew-eta16-n320pc-

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run or resume minimization
        env:
          JAX_PLATFORM_NAME: cpu
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '1'
          MAXITER: '100000'
          PC: '1'
          PC_ETA0: '8.0'
          TOTAL_MAXITER: '1000000'
          CHECKPOINT_EVERY: '10000'
        run: python -u free_ar.py 16 320 start16pc eta16_N320pcpc | tee run.log

      - name: Check whether the global iteration limit was reached
        id: check_done
        shell: bash
        env:
          TOTAL_MAXITER: '1000000'
        run: |
          python - <<'PYCODE'
          import json, os
          with open("free_eta16_N320pcpc_state.json", encoding="utf-8") as f:
              state = json.load(f)
          nit = int(state["nit_ckpt"])
          limit = int(os.environ["TOTAL_MAXITER"])
          finished = nit >= limit
          print(f"Checkpoint cumulatif : {nit} / {limit}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"finished={'true' if finished else 'false'}\n")
          PYCODE

      - name: Preserve checkpoint and history artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PEW-eta16-N320pc-checkpoint-chunk-01
          path: |
            numerical_minimization/eta16_N320pc/free_eta16_N320pcpc_checkpoint.npz
            numerical_minimization/eta16_N320pc/*ckpt.npy
            numerical_minimization/eta16_N320pc/*state.json
            numerical_minimization/eta16_N320pc/*history.jsonl
            numerical_minimization/eta16_N320pc/run.log
            numerical_minimization/eta16_N320pc/LISEZMOI.txt
          if-no-files-found: warn
          retention-days: 30
