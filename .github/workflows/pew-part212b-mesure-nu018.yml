name: PEW part212b mesure du noeud nu=0.18 (champ de l'artefact du run part212, archive perdue par conflit de push)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  mesure:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: numerical_minimization/protect3d_Z
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: numerical_minimization/protect3d_Z/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt "scipy>=1.15"
      - name: Artefact de la chaine nu
        uses: actions/download-artifact@v4
        with:
          name: champs_homotopie_nu
          run-id: '45794170732'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: numerical_minimization/protect3d_Z/art
      - name: Mesure nu=0.18 (et verification nu=0.24 effondre)
        run: |
          ls -la art
          python halo_mesure.py art/relaxe_nu_nu018.npy --h 0.5 --mu 0.375 --e0 0.25 --d2 1e-3 --nu 0.18 --tag nu018 --out halo_nu018.json | tee halo_nu018.log
          python halo_composantes.py art/relaxe_nu_nu018.npy --h 0.5 --e0 0.25 --nu 0.18 --tag nu018 --out comp_nu018.json | tee comp_nu018.log
      - name: Archive
        run: |
          mkdir -p ../../resultats/part212
          cp halo_nu018.* comp_nu018.* ../../resultats/part212/
          cd ../..
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add resultats/part212
          git commit -m "part212b nu=0.18 : mesures

          Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_012qTVdE7fweMvxDdweHMqCg"
          ok=0
          for i in 1 2 3 4 5 6; do
            if git pull --rebase origin main && git push origin HEAD:main; then ok=1; break; fi
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 20 + 5))
          done
          if [ "$ok" != 1 ]; then echo "ECHEC du push"; exit 1; fi
