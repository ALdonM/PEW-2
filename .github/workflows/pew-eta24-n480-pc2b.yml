name: PEW eta24 N480 PRECOND 2b suite 1 000 000 it (arret a volonte)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  chunk01:
    name: PEW eta24 N480 PRECOND2b chunk 01/20
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    outputs:
      finished: ${{ steps.check_done.outputs.finished }}
    defaults:
      run:
        working-directory: numerical_minimization/eta24_N480pc2b
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: numerical_minimization/eta24_N480pc2b/requirements.txt

      - name: Restore latest checkpoint and history
        uses: actions/cache@v4
        with:
          path: |
            numerical_minimization/eta24_N480pc2b/free_eta24_N480pc2b_checkpoint.npz
            numerical_minimization/eta24_N480pc2b/f_free_eta24_N480pc2b_ckpt.npy
            numerical_minimization/eta24_N480pc2b/dchi_free_eta24_N480pc2b_ckpt.npy
            numerical_minimization/eta24_N480pc2b/free_eta24_N480pc2b_state.json
            numerical_minimization/eta24_N480pc2b/free_eta24_N480pc2b_history.jsonl
          key: pew-eta24-n480pc2b-${{ github.run_id }}-${{ github.run_attempt }}-chunk-01
          restore-keys: |
            pew-eta24-n480pc2b-

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run or resume minimization
        env:
          JAX_PLATFORM_NAME: cpu
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '1'
          MAXITER: '50000'
          PC: '1'
          PC_ETA0: '8.0'
          PC2: '1'
          PC2_FLOOR: '1e-3'
          PC2_REF: 'ref_f24_200k.npy'
          TOTAL_MAXITER: '1000000'
          CHECKPOINT_EVERY: '10000'
        run: python -u free_ar.py 24 480 start24pc2b eta24_N480pc2b | tee run.log

      - name: Check whether the global iteration limit was reached
        id: check_done
        shell: bash
        env:
          TOTAL_MAXITER: '1000000'
        run: |
          python - <<'PYCODE'
          import json, os
          with open("free_eta24_N480pc2b_state.json", encoding="utf-8") as f:
              state = json.load(f)
          nit = int(state["nit_ckpt"])
          limit = int(os.environ["TOTAL_MAXITER"])
          finished = nit >= limit
          print(f"Checkpoint cumulatif : {nit} / {limit}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"finished={'true' if finished else 'false'}\n")
          PYCODE

      - name: Preserve checkpoint and history artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PEW-eta24-N480pc2b-checkpoint-chunk-01
          path: |
            numerical_minimization/eta24_N480pc2b/free_eta24_N480pc2b_checkpoint.npz
            numerical_minimization/eta24_N480pc2b/*ckpt.npy
            numerical_minimization/eta24_N480pc2b/*state.json
            numerical_minimization/eta24_N480pc2b/*history.jsonl
            numerical_minimization/eta24_N480pc2b/run.log
            numerical_minimization/eta24_N480pc2b/LISEZMOI.txt
          if-no-files-found: warn
          retention-days: 30
