name: PEW part200 Faddeev temporel - chute libre (gradient impose) et retard d'onde libre (k=3)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  f_g0:
    name: part200 f_g0
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    defaults:
      run:
        working-directory: numerical_minimization/protect3d_Z
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: numerical_minimization/protect3d_Z/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt scipy
      - name: Depart
        run: python -c "import numpy as np; f=np.load('../../resultats/part193/p193_s2_r100/p193_s2_r100_champ_final.npy').astype(np.float32); x=(np.arange(96)-48+.5)*.5; np.save('init96.npy', (f*(1+0.0*x)[None,:,None,None]).astype(np.float32))"
      - name: Run
        env:
          N: '96'
          NB: '96'
          H: '0.5'
          E0: '0.25'
          DT: '0.005'
          T0: '0'
          MODE: 'hot'
          TC0: '1000000'
          TH: '0'
          TC: '0'
          TSTART_H: '0'
          G0: '0'
          WARM: '0'
          MU: '0.375'
          MEAS: '2.0'
          SNAP: '1000'
          TIME_BUDGET: '18900'
          JAX_PLATFORM_NAME: 'cpu'
          OMP_NUM_THREADS: '4'
          BARRIER: '0'
          NOEUDS: '0'
          KC: '0'
          SEED: '1'
          FINAL32: '1'
          CP: '1'
          MEANC: '0'
          SPR0: '16'
          SPRB: '24'
          SPSIG: '0.3'
          KW0: '1'
          WA: '1'
          WR: '1'
          WV: '1'
          KT: '1'
          KF: '1'
          GRAD: '0.0'
          INIT: 'file'
          INIT_FILE: 'init96.npy'
          T_END: '18'
        run: python -u dyn186c.py p200_f_g0 2>&1 | tee run_p200_f_g0.log
      - name: Commit results to resultats/
        if: always()
        shell: bash
        run: |
          OUT=../../resultats/part200/p200_f_g0; mkdir -p $OUT
          cp p200_f_g0_history.jsonl p200_f_g0_params.json p200_f_g0_state.json p200_f_g0_champ_final.npy $OUT/ || true
          cd ../..; git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resultats/part200/p200_f_g0; git commit -q -m 'part200 f_g0 : resultats' || exit 0
          ok=0; for i in $(seq 1 20); do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && ok=1 && break; git rebase --abort 2>/dev/null; sleep $((RANDOM % 30 + 5)); done
          test $ok = 1
