name: PEW part184zg q0 de paire pour le balayage en nu

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  q_o14_n14:
    name: q0 omega 0.14 nu 0.14
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: numerical_minimization/protect3d_Z
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: numerical_minimization/protect3d_Z/requirements.txt
      - run: python -m pip install -r requirements.txt scipy
      - uses: actions/download-artifact@v4
        with:
          name: relaxg_o14_n14_s4
          path: numerical_minimization/protect3d_Z
          run-id: '45068587944'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Paire courte
        env:
          N: '128'
          H: '0.5'
          NB: '128'
          SEPC: '20'
          REXT: '22'
          RA1: '12'
          RA2: '22'
          D2: '0.001'
          GUARD: '1e-6'
          DT: '0.02'
          ORIENT: z
          VPROD: '1'
          QPROF: '1'
          QCUR: '1'
          STATE: relaxedg_state.npz
          RELAXED: relaxedg.npy
        run: python jauge.py pair 0.14 0.02 0.14 0.2 ZG_o14_n14 opp opp | tee ZG_o14_n14.log
      - name: Archive dans resultats/part184
        if: always()
        working-directory: .
        run: |
          mkdir -p resultats/part184/gh_part184zg
          cp numerical_minimization/protect3d_Z/ZG_o14_n14.log resultats/part184/gh_part184zg/ || true
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add resultats/part184/gh_part184zg
          git commit -m "part184zg q0 de paire omega 0.14 nu 0.14 : journal

          Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_012qTVdCRHJ2LxJqKJUux8qy" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && break || sleep $((RANDOM % 20 + 5)); done
