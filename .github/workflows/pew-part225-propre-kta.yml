name: PEW part225 nuds a frequence interne omega en chute propre (eponge SPREF) +g et -g ; puis variante horloge locale KTA +1 et -1 (cinetique / a^2)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  w000_gp_k0:
    name: part225 w000_gp_k0
    runs-on: ubuntu-24.04
    timeout-minutes: 358
    defaults:
      run:
        working-directory: numerical_minimization/protect3d_Z
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: numerical_minimization/protect3d_Z/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt "scipy>=1.15"
      - name: Noeud avec frequence interne
        uses: actions/download-artifact@v4
        with:
          name: rot_Q1
          run-id: 46076401826
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: numerical_minimization/protect3d_Z/rot
      - name: Depart float32
        run: python -c "import numpy as np; np.save('init.npy', np.load('rot/rot_Q1_w000.npy').astype(np.float32))"
      - name: Chute
        env:
          N: '96'
          NB: '96'
          H: '0.5'
          E0: '0.25'
          DT: '0.005'
          T0: '0'
          MODE: 'hot'
          TC0: '1000000'
          TH: '0'
          TC: '0'
          TSTART_H: '0'
          G0: '0'
          WARM: '0'
          MU: '0.375'
          MEAS: '0.25'
          SNAP: '1000'
          TIME_BUDGET: '20500'
          JAX_PLATFORM_NAME: 'cpu'
          OMP_NUM_THREADS: '4'
          BARRIER: '0'
          NOEUDS: '0'
          KC: '0'
          SEED: '1'
          FINAL32: '1'
          CP: '0'
          MEANC: '0'
          SPSIG: '0.3'
          KW0: '1'
          WA: '1'
          WR: '1'
          WV: '1'
          KT: '1'
          KF: '1'
          NU: '0.12'
          GRAD: '0'
          INIT: 'file'
          INIT_FILE: 'init.npy'
          SPR0: '18'
          SPRB: '24'
          SPREF: '1'
          T_END: '24'
          RF: '12'
          GRADA: '0.02'
          V0ROT: '0.0'
          KTA: '0'
        run: python -u dyn186c.py p225_w000_gp_k0 2>&1 | tee run_p225_w000_gp_k0.log
      - name: Archive
        if: always()
        shell: bash
        run: |
          mkdir -p ../../resultats/part225/p225_w000_gp_k0; cp p225_w000_gp_k0_history.jsonl p225_w000_gp_k0_params.json run_p225_w000_gp_k0.log ../../resultats/part225/p225_w000_gp_k0/ 2>/dev/null || true
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cd ../..
          git add resultats/part225/p225_w000_gp_k0; git commit -q -m 'part225 w000_gp_k0' || exit 0
          ok=0; for i in $(seq 1 30); do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && ok=1 && break; git rebase --abort 2>/dev/null; sleep $((RANDOM % 40 + 5)); done
          test $ok = 1
