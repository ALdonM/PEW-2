name: PEW part186b cycle contraction-relachement (houle / ecume)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  slow_a05_r1:
    name: part186b slow_a05 chunk 1/3
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    outputs:
      finished: ${{ steps.check_done.outputs.finished }}
    defaults:
      run:
        working-directory: numerical_minimization/protect3d_Z
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: numerical_minimization/protect3d_Z/requirements.txt
      - name: Restore checkpoint
        uses: actions/cache@v4
        with:
          path: |
            numerical_minimization/protect3d_Z/ck_p186b_slow_a05.npz
            numerical_minimization/protect3d_Z/p186b_slow_a05_history.jsonl
            numerical_minimization/protect3d_Z/p186b_slow_a05_params.json
            numerical_minimization/protect3d_Z/p186b_slow_a05_proj.npy
          key: p186b-slow_a05-r1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            p186b-slow_a05-
      - name: Install dependencies
        run: python -m pip install -r requirements.txt scipy
      - name: Run or resume
        env:
          MODE: 'cycle'
          INIT: 'file'
          INIT_FILE: '../../resultats/part179/wk_T0/wk_T0_champ_final.npy'
          MU: '0.375'
          E0: '0.25'
          N: '64'
          H: '0.5'
          DT: '0.0025'
          T0: '0.0'
          TREL: '5'
          TCOMP: '40'
          TBACK: '30'
          G0R: '0.5'
          G0C: '0.02'
          T_END: '120'
          MEAS: '1.0'
          SNAP: '1000'
          TIME_BUDGET: '18900'
          JAX_PLATFORM_NAME: 'cpu'
          OMP_NUM_THREADS: '4'
          BARRIER: '0'
          SEED: '1'
          NOEUDS: '0'
          AMIN: '0.5'
        run: python -u dyn186.py p186b_slow_a05 2>&1 | tee run_p186b_slow_a05_r1.log
      - name: Check whether finished
        id: check_done
        shell: bash
        run: |
          python - <<'PYCODE'
          import json, os
          st = json.load(open('p186b_slow_a05_state.json')); print(st)
          open(os.environ['GITHUB_OUTPUT'], 'a').write('finished=' + ('true' if st['finished'] else 'false') + '\n')
          PYCODE
      - name: Commit results to resultats/
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          OUT=../../resultats/part186b/p186b_slow_a05; mkdir -p $OUT
          cp p186b_slow_a05_history.jsonl p186b_slow_a05_params.json p186b_slow_a05_state.json p186b_slow_a05_champ_final.npy $OUT/ 2>/dev/null || true
          cd ../..; git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resultats/part186b/p186b_slow_a05; git commit -q -m 'part186b slow_a05 chunk 1 : resultats' || exit 0
          ok=0; for i in $(seq 1 12); do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && ok=1 && break; git rebase --abort 2>/dev/null; sleep $((RANDOM % 30 + 5)); done
          test $ok = 1
