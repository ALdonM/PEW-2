name: PEW part184k diagnostics de la perte de L (Q identiques sans annihilation, regularisation d2 et garde-fou)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  paires:
    name: part184k ${{ matrix.tag }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - {tag: T1_Qsame_om02_N96, h: '0.5', n: '96', nrel: '48', nb: '48', sepc: '20', dt: '0.02', g2: '0', om: '0.2', sj: opp, sq: same, nu: '0.12', tend: '16', d2: '0.001', guard: '1e-6', rext: '22', ra1: '12', ra2: '22'}
          - {tag: T2_Qsame_om0_N96,  h: '0.5', n: '96', nrel: '48', nb: '48', sepc: '20', dt: '0.02', g2: '0', om: '0.0', sj: opp, sq: same, nu: '0.12', tend: '16', d2: '0.001', guard: '1e-6', rext: '22', ra1: '12', ra2: '22'}
          - {tag: T3_reg_petit_N64,  h: '0.5', n: '64', nrel: '48', nb: '48', sepc: '10', dt: '0.02', g2: '0', om: '0.2', sj: opp, sq: opp, nu: '0.12', tend: '8', d2: '0.00001', guard: '1e-9', rext: '10', ra1: '6', ra2: '11'}
          - {tag: T4_reg_grand_N64,  h: '0.5', n: '64', nrel: '48', nb: '48', sepc: '10', dt: '0.02', g2: '0', om: '0.2', sj: opp, sq: opp, nu: '0.12', tend: '8', d2: '0.01', guard: '1e-4', rext: '10', ra1: '6', ra2: '11'}
    defaults:
      run:
        working-directory: numerical_minimization/protect3d_Z
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: numerical_minimization/protect3d_Z/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt scipy
      - name: Relaxe un noeud isole (N=48)
        env:
          N: ${{ matrix.nrel }}
          H: ${{ matrix.h }}
        run: python jauge.py relax ${{ matrix.nu }} relaxed.npy
      - name: Paire (resolution)
        env:
          N: ${{ matrix.n }}
          H: ${{ matrix.h }}
          NB: ${{ matrix.nb }}
          SEPC: ${{ matrix.sepc }}
          REXT: ${{ matrix.rext }}
          RA1: ${{ matrix.ra1 }}
          RA2: ${{ matrix.ra2 }}
          D2: ${{ matrix.d2 }}
          GUARD: ${{ matrix.guard }}
          RELAXED: relaxed.npy
          DT: ${{ matrix.dt }}
        run: python jauge.py pair ${{ matrix.nu }} ${{ matrix.g2 }} ${{ matrix.om }} ${{ matrix.tend }} ${{ matrix.tag }} ${{ matrix.sq }} ${{ matrix.sj }} | tee ${{ matrix.tag }}.log
      - name: Archive le journal dans resultats/part184
        if: always()
        working-directory: .
        run: |
          mkdir -p resultats/part184/gh_part184k
          cp numerical_minimization/protect3d_Z/${{ matrix.tag }}.log numerical_minimization/protect3d_Z/${{ matrix.tag }}_proj.npy resultats/part184/gh_part184k/ || true
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add resultats/part184/gh_part184k
          git commit -m "part184k paire ${{ matrix.tag }} : journal

          Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_012qTVdBcwjjMSGxvefBTrWg" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && break || sleep $((RANDOM % 20 + 5)); done
