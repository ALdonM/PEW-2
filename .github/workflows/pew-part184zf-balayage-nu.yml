name: PEW part184zf balayage de nu a omega fixe relaxation avec jauge N128

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  r_o14_n14_s1:
    name: relaxation omega 0.14 nu 0.14 etape 1/4
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    defaults:
      run:
        working-directory: numerical_minimization/protect3d_Z
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: numerical_minimization/protect3d_Z/requirements.txt
      - run: python -m pip install -r requirements.txt scipy
      - uses: actions/download-artifact@v4
        with:
          name: relaxed128n
          path: numerical_minimization/protect3d_Z
          run-id: '44638873798'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: relaxation avec jauge
        env:
          N: '128'
          H: '0.5'
          RELT: '25'
          OMREL: '0.14'
          RG2: '0.02'
          RELIN: relaxed.npy
        run: python jauge.py relax 0.14 relaxedg.npy | tee relax_o14_n14_s1.log
      - uses: actions/upload-artifact@v4
        with:
          name: relaxg_o14_n14_s1
          path: |
            numerical_minimization/protect3d_Z/relaxedg.npy
            numerical_minimization/protect3d_Z/relaxedg_state.npz
          if-no-files-found: error
      - name: Archive dans resultats/part184
        if: always()
        working-directory: .
        run: |
          mkdir -p resultats/part184/gh_part184zf
          cp numerical_minimization/protect3d_Z/relax_o14_n14_s1.log resultats/part184/gh_part184zf/ || true
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add resultats/part184/gh_part184zf
          git commit -m "part184zf relaxation omega 0.14 nu 0.14 etape 1/4 : journal

          Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_012qTVdCRHJ2LxJqKJUux8qy" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && break || sleep $((RANDOM % 20 + 5)); done
