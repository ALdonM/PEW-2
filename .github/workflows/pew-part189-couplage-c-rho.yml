name: PEW part189 couplage vitesse de phase c = rho/rho_vac (iceberg)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  relax:
    name: part189 relax
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    defaults:
      run:
        working-directory: numerical_minimization/protect3d_Z
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: numerical_minimization/protect3d_Z/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt scipy
      - name: Run
        env:
          N: '64'
          H: '0.5'
          MU: '0.375'
          E0: '0.25'
          DT: '0.0025'
          T0: '0'
          MEAS: '2.0'
          SNAP: '1000'
          TIME_BUDGET: '18900'
          JAX_PLATFORM_NAME: 'cpu'
          OMP_NUM_THREADS: '4'
          BARRIER: '0'
          NOEUDS: '0'
          KC: '0'
          SEED: '1'
          FINAL32: '1'
          CP: '1'
          MODE: 'none'
          G0: '0.5'
          T_END: '20'
          INIT: 'file'
          INIT_FILE: '../../resultats/part179/wk_T0/wk_T0_champ_final.npy'
          NB: '64'
        run: |
          python -u dyn186c.py p189_relax 2>&1 | tee run_p189_relax.log
          python - <<'PYCODE'
          import json; st = json.load(open('p189_relax_state.json')); print(st); assert st['finished']
          PYCODE
      - name: Commit results to resultats/
        shell: bash
        run: |
          OUT=../../resultats/part189/p189_relax; mkdir -p $OUT
          cp p189_relax_history.jsonl p189_relax_params.json p189_relax_state.json p189_relax_champ_final.npy $OUT/
          cd ../..; git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resultats/part189/p189_relax; git commit -q -m 'part189 relax : resultats'
          ok=0; for i in $(seq 1 20); do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && ok=1 && break; git rebase --abort 2>/dev/null; sleep $((RANDOM % 30 + 5)); done
          test $ok = 1
