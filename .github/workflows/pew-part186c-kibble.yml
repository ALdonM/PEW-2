name: PEW part186c trempe a la Kibble (champ aleatoire a l echelle de l horizon, expansion)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  exp_t2_s1_r1:
    name: part186c exp_t2_s1 chunk 1/2
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    outputs:
      finished: ${{ steps.check_done.outputs.finished }}
    defaults:
      run:
        working-directory: numerical_minimization/protect3d_Z
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: numerical_minimization/protect3d_Z/requirements.txt
      - name: Restore checkpoint
        uses: actions/cache@v4
        with:
          path: |
            numerical_minimization/protect3d_Z/ck_p186c_exp_t2_s1.npz
            numerical_minimization/protect3d_Z/p186c_exp_t2_s1_history.jsonl
            numerical_minimization/protect3d_Z/p186c_exp_t2_s1_params.json
            numerical_minimization/protect3d_Z/p186c_exp_t2_s1_proj.npy
          key: p186c-exp_t2_s1-r1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            p186c-exp_t2_s1-
      - name: Install dependencies
        run: python -m pip install -r requirements.txt scipy
      - name: Run or resume
        env:
          MODE: 'hot'
          NORM: '1'
          INIT: 'chaos'
          MU: '0.375'
          E0: '0.25'
          N: '64'
          H: '0.5'
          DT: '0.0025'
          T0: '0'
          TH: '0'
          TC: '0'
          TSTART_H: '0'
          G0: '0'
          WARM: '0'
          MEAS: '1.0'
          SNAP: '1000'
          TIME_BUDGET: '18900'
          JAX_PLATFORM_NAME: 'cpu'
          OMP_NUM_THREADS: '4'
          BARRIER: '0'
          NOEUDS: '1'
          KC: '0'
          TC0: '2'
          XI0: '2'
          T_END: '16'
          SEED: '1'
        run: python -u dyn186c.py p186c_exp_t2_s1 2>&1 | tee run_p186c_exp_t2_s1_r1.log
      - name: Check whether finished
        id: check_done
        shell: bash
        run: |
          python - <<'PYCODE'
          import json, os
          st = json.load(open('p186c_exp_t2_s1_state.json')); print(st)
          open(os.environ['GITHUB_OUTPUT'], 'a').write('finished=' + ('true' if st['finished'] else 'false') + '\n')
          PYCODE
      - name: Commit results to resultats/
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          OUT=../../resultats/part186c/p186c_exp_t2_s1; mkdir -p $OUT
          cp p186c_exp_t2_s1_history.jsonl p186c_exp_t2_s1_params.json p186c_exp_t2_s1_state.json p186c_exp_t2_s1_champ_final.npy $OUT/ 2>/dev/null || true
          cd ../..; git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resultats/part186c/p186c_exp_t2_s1; git commit -q -m 'part186c exp_t2_s1 chunk 1 : resultats' || exit 0
          ok=0; for i in $(seq 1 12); do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && ok=1 && break; git rebase --abort 2>/dev/null; sleep $((RANDOM % 30 + 5)); done
          test $ok = 1
  exp_t2_s1_r2:
    name: part186c exp_t2_s1 chunk 2/2
