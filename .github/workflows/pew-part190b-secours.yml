name: PEW part190b secours (T_END=24) amplitude de la porteuse sans masse (profil rho-1 autour du noeud)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  m010b:
    name: part190 m010b
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    defaults:
      run:
        working-directory: numerical_minimization/protect3d_Z
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: numerical_minimization/protect3d_Z/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt scipy
      - name: Preparer le noeud dans la boite 96
        run: python prep_embed96.py ../../resultats/part179/wk_T0/wk_T0_champ_final.npy init96.npy 96
      - name: Run
        env:
          N: '96'
          NB: '96'
          H: '0.5'
          E0: '0.25'
          DT: '0.005'
          T0: '0'
          MODE: 'none'
          G0: '0.5'
          T_END: '24'
          MEAS: '4.0'
          SNAP: '1000'
          TIME_BUDGET: '18900'
          JAX_PLATFORM_NAME: 'cpu'
          OMP_NUM_THREADS: '4'
          BARRIER: '0'
          NOEUDS: '0'
          KC: '0'
          SEED: '1'
          FINAL32: '1'
          CP: '1'
          INIT: 'file'
          INIT_FILE: 'init96.npy'
          MU: '0.1'
        run: |
          python -u dyn186c.py p190_m010b 2>&1 | tee run_p190_m010b.log
          python - <<'PYCODE'
          import json; st = json.load(open('p190_m010b_state.json')); print(st)
          PYCODE
      - name: Commit results to resultats/
        if: always()
        shell: bash
        run: |
          OUT=../../resultats/part190/p190_m010b; mkdir -p $OUT
          cp p190_m010b_history.jsonl p190_m010b_params.json p190_m010b_state.json p190_m010b_champ_final.npy $OUT/ || true
          cd ../..; git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resultats/part190/p190_m010b; git commit -q -m 'part190b m010b : resultats'
          ok=0; for i in $(seq 1 20); do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && ok=1 && break; git rebase --abort 2>/dev/null; sleep $((RANDOM % 30 + 5)); done
          test $ok = 1
  m005b:
