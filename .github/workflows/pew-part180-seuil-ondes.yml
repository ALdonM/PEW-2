name: PEW part180 seuil de l energie des ondes porteuses injectees dans un noeud

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  c0_c1:
    name: part180 c0 chunk 1/2
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    outputs:
      finished: ${{ steps.check_done.outputs.finished }}
    defaults:
      run:
        working-directory: numerical_minimization/protect3d_Z
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: numerical_minimization/protect3d_Z/requirements.txt
      - name: Restore checkpoint
        uses: actions/cache@v4
        with:
          path: |
            numerical_minimization/protect3d_Z/ck_p180_c0.npz
            numerical_minimization/protect3d_Z/p180_c0_history.jsonl
            numerical_minimization/protect3d_Z/p180_c0_params.json
          key: p180-c0-c1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            p180-c0-
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run or resume
        env:
          MODE: 'lang'
          G0: '0.0'
          G0R: '0.0'
          MU: '0.375'
          E0: '0.25'
          N: '64'
          H: '0.5'
          T0: '10'
          DT: '0.0025'
          SNAP: '1000'
          TIME_BUDGET: '19000'
          JAX_PLATFORM_NAME: 'cpu'
          OMP_NUM_THREADS: '4'
          BARRIER: '0'
          INIT: 'file'
          INIT_FILE: '../../resultats/part179/wk_T0/wk_T0_champ_final.npy'
          TON: '2'
          T_END: '62'
          MEAS: '0.5'
          NOEUDS: '0'
          TSTART: '0.0'
          TQ: '0'
          SEED: '1'
          EINJ: '0'
          KC: '1.5'
        run: python -u dyn.py p180_c0 2>&1 | tee run_p180_c0_c1.log
      - name: Check whether finished
        id: check_done
        shell: bash
        run: |
          python - <<'PYCODE'
          import json, os
          st = json.load(open('p180_c0_state.json')); print(st)
          open(os.environ['GITHUB_OUTPUT'], 'a').write('finished=' + ('true' if st['finished'] else 'false') + '\n')
          PYCODE
      - name: Sauvegarde en artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p180_c0-c1
          path: |
            numerical_minimization/protect3d_Z/p180_c0_history.jsonl
            numerical_minimization/protect3d_Z/p180_c0_params.json
            numerical_minimization/protect3d_Z/p180_c0_state.json
            numerical_minimization/protect3d_Z/p180_c0_champ_final.npy
          if-no-files-found: ignore
      - name: Commit results to resultats/
        if: always()
        shell: bash
        run: |
          OUT=../../resultats/part180/p180_c0; mkdir -p $OUT
          cp p180_c0_history.jsonl p180_c0_params.json p180_c0_state.json p180_c0_champ_final.npy $OUT/ 2>/dev/null || true
          cd ../..; git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resultats/part180/p180_c0; git commit -q -m 'part180 c0 chunk 1 : resultats' || exit 0
          ok=0; for i in $(seq 1 12); do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && ok=1 && break; git rebase --abort 2>/dev/null; sleep $((RANDOM % 30 + 5)); done
          test $ok = 1
