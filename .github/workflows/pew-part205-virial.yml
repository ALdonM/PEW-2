name: PEW part205 profil cumule du virial du noeud (nu et L)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  L32n0p12:
    name: part205 nu0.12 L=32
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    defaults:
      run:
        working-directory: numerical_minimization/protect3d_Z
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: numerical_minimization/protect3d_Z/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt scipy
      - name: Run
        env:
          JAX_PLATFORM_NAME: cpu
          OMP_NUM_THREADS: '4'
          NU: '0.12'
        run: python -u relax_stress205.py 32 0.5 19000 2>&1 | tee run_L32_nu0.12.log
      - name: Commit results to resultats/
        if: always()
        shell: bash
        run: |
          OUT=../../resultats/part205/L32n0p12; mkdir -p $OUT
          cp stress205_L32_h0.5_nu0.12.json run_L32_nu0.12.log $OUT/ || true
          cd ../..; git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resultats/part205/L32n0p12; git commit -q -m 'part205 nu0.12 L=32 : resultats' || exit 0
          ok=0; for i in $(seq 1 20); do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && ok=1 && break; git rebase --abort 2>/dev/null; sleep $((RANDOM % 30 + 5)); done
          test $ok = 1


