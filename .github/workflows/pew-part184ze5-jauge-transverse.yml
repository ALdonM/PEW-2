name: PEW part184ze absorbeur transverse de la jauge (paire x Jo omega 0,14)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  paires:
    name: part184ze ${{ matrix.tag }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - {tag: ZT_xJo_om14_spg1t, spm: '1.0', spg: '1.0', sprot: '1'}
          - {tag: ZT_xJo_om14_spg3t, spm: '1.0', spg: '3.0', sprot: '1'}
    defaults:
      run:
        working-directory: numerical_minimization/protect3d_Z
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: numerical_minimization/protect3d_Z/requirements.txt
      - run: python -m pip install -r requirements.txt scipy
      - uses: actions/download-artifact@v4
        with:
          name: relaxedg_R014
          path: numerical_minimization/protect3d_Z
          run-id: '44490353713'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Paire (profil de charge QPROF et courant au plan median QCUR)
        env:
          N: '96'
          H: '0.5'
          NB: '96'
          SEPC: '20'
          REXT: '22'
          RA1: '12'
          RA2: '22'
          D2: '0.001'
          GUARD: '1e-6'
          DT: '0.02'
          ORIENT: x
          VPROD: '1'
          QPROF: '1'
          QCUR: '1'
          STATE: relaxedg_state.npz
          GAUSS: '1'
          SPM: ${{ matrix.spm }}
          SPG: ${{ matrix.spg }}
          SPROT: ${{ matrix.sprot }}
          SPRS: '18'
          SPGT: '1'
        run: |
          if [ -f relaxedg.npy ]; then export RELAXED=relaxedg.npy; else export RELAXED=relaxed.npy; fi
          if [ -z "$STATE" ]; then unset STATE; fi
          python jauge.py pair 0.12 0.02 0.14 60 ${{ matrix.tag }} opp opp | tee ${{ matrix.tag }}.log
      - name: Archive dans resultats/part184
        if: always()
        working-directory: .
        run: |
          mkdir -p resultats/part184/gh_part184ze
          cp numerical_minimization/protect3d_Z/${{ matrix.tag }}.log resultats/part184/gh_part184ze/ || true
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add resultats/part184/gh_part184ze
          git commit -m "part184ze paire ${{ matrix.tag }} : journal

          Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_012qTVdBqQanp7VoG9CMMcjx" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && break || sleep $((RANDOM % 20 + 5)); done
