name: PEW part178 pilote refroidissement avec bruit (Langevin) et temoin noeud isole

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  cool_tq3_s1_c1:
    name: part178 cool_tq3_s1 chunk 1/3
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    outputs:
      finished: ${{ steps.check_done.outputs.finished }}
    defaults:
      run:
        working-directory: numerical_minimization/protect3d_Z
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: numerical_minimization/protect3d_Z/requirements.txt
      - name: Restore checkpoint
        uses: actions/cache@v4
        with:
          path: |
            numerical_minimization/protect3d_Z/ck_cool_tq3_s1.npz
            numerical_minimization/protect3d_Z/cool_tq3_s1_history.jsonl
            numerical_minimization/protect3d_Z/cool_tq3_s1_params.json
          key: p178-cool_tq3_s1-c1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            p178-cool_tq3_s1-
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run or resume
        env:
          N: '64'
          H: '0.5'
          E0: '0.25'
          MU: '0.375'
          T0: '10'
          DT: '0.0025'
          MEAS: '1.0'
          SNAP: '1000'
          TIME_BUDGET: '19000'
          JAX_PLATFORM_NAME: 'cpu'
          OMP_NUM_THREADS: '4'
          BARRIER: '0'
          INIT: 'chaos'
          XI0: '2.0'
          RMS: '1.0'
          MODE: 'lang'
          G0: '0.1'
          TSTART: '1.0'
          TQ: '3'
          TLAW: 'exp'
          THOLD: '10'
          TON: '0'
          SEED: '1'
          T_END: '53'
          NOEUDS: '1'
        run: python -u dyn.py cool_tq3_s1 2>&1 | tee run_cool_tq3_s1_c1.log
      - name: Check whether finished
        id: check_done
        shell: bash
        run: |
          python - <<'PYCODE'
          import json, os
          st = json.load(open('cool_tq3_s1_state.json')); print(st)
          open(os.environ['GITHUB_OUTPUT'], 'a').write('finished=' + ('true' if st['finished'] else 'false') + '\n')
          PYCODE
      - name: Commit results to resultats/
        if: always()
        shell: bash
        run: |
          OUT=../../resultats/part178/cool_tq3_s1; mkdir -p $OUT
          cp cool_tq3_s1_history.jsonl cool_tq3_s1_params.json cool_tq3_s1_state.json cool_tq3_s1_champ_final.npy $OUT/ 2>/dev/null || true
          cd ../..; git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resultats/part178/cool_tq3_s1; git commit -q -m 'part178 cool_tq3_s1 chunk 1 : resultats' || exit 0
          for i in $(seq 1 12); do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep $((RANDOM % 30 + 5)); done
