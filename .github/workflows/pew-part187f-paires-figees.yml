name: PEW part187f paires de noeuds a coeurs figes, relaxees a nu=0.12, L=64 (z, x, diagonale ; charges opposees et egales)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  paires:
    name: part187f ${{ matrix.tag }}
    runs-on: ubuntu-24.04
    timeout-minutes: 358
    strategy:
      fail-fast: false
      matrix:
        include:
          - {tag: opp_z_d12, dir: z, s: '12', ch: opp}
          - {tag: opp_z_d18, dir: z, s: '18', ch: opp}
          - {tag: opp_z_d24, dir: z, s: '24', ch: opp}
          - {tag: opp_x_d12, dir: x, s: '12', ch: opp}
          - {tag: opp_x_d18, dir: x, s: '18', ch: opp}
          - {tag: opp_x_d24, dir: x, s: '24', ch: opp}
          - {tag: opp_diag_d11, dir: diag, s: '8', ch: opp}
          - {tag: opp_diag_d18, dir: diag, s: '13', ch: opp}
          - {tag: opp_diag_d24, dir: diag, s: '17', ch: opp}
          - {tag: same_z_d12, dir: z, s: '12', ch: same}
          - {tag: same_z_d18, dir: z, s: '18', ch: same}
          - {tag: same_z_d24, dir: z, s: '24', ch: same}
          - {tag: same_x_d12, dir: x, s: '12', ch: same}
          - {tag: same_x_d18, dir: x, s: '18', ch: same}
          - {tag: same_x_d24, dir: x, s: '24', ch: same}
          - {tag: same_diag_d11, dir: diag, s: '8', ch: same}
          - {tag: same_diag_d18, dir: diag, s: '13', ch: same}
          - {tag: same_diag_d24, dir: diag, s: '17', ch: same}
    defaults:
      run:
        shell: bash
        working-directory: numerical_minimization/protect3d_Z
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: numerical_minimization/protect3d_Z/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt "scipy>=1.15"
      - name: Noeud isole relaxe (L=64, nu=0.12) du run 44638347471
        uses: actions/download-artifact@v4
        with:
          run-id: 44638347471
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: champ_relaxe_nu012_L64_N128
          path: numerical_minimization/protect3d_Z/seul
      - name: Depart de la paire (coeurs de rayon 5 figes a la valeur du noeud isole)
        run: |
          ls -la seul
          python paire_depart.py seul/relaxe_nu012_L64_N128.npy --h 0.5 --dir ${{ matrix.dir }} --s ${{ matrix.s }} --charge ${{ matrix.ch }} --rc 5 --tag ${{ matrix.tag }}
      - name: Relaxation de tout le reste (float64, L-BFGS-B, nu=0.12)
        run: |
          python halo_relax.py --in depart_${{ matrix.tag }}.npy --N 128 --h 0.5 --mu 0.375 --e0 0.25 --d2 1e-3 --nu 0.12 \
            --free libre_${{ matrix.tag }}.npy --maxit 3000 --save 200 --tmax 19000 --no-degree --out relaxe_${{ matrix.tag }}.npy | tee relaxe_${{ matrix.tag }}.log
      - name: Energie d interaction et charge
        if: always()
        run: |
          python paire_mesure.py relaxe_${{ matrix.tag }}.npy --seul seul/relaxe_nu012_L64_N128.npy --nu 0.12 --h 0.5 --tag ${{ matrix.tag }} --out paire_${{ matrix.tag }}.json | tee paire_${{ matrix.tag }}.log
      - name: Champ relaxe en artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: champ_paire_${{ matrix.tag }}
          path: numerical_minimization/protect3d_Z/relaxe_${{ matrix.tag }}.npy
          retention-days: 30
      - name: Archive dans resultats/part187f
        if: always()
        run: |
          mkdir -p ../../resultats/part187f
          cp relaxe_${{ matrix.tag }}.log paire_${{ matrix.tag }}.* ../../resultats/part187f/
          cd ../..
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add resultats/part187f
          if git diff --cached --quiet; then echo "rien a archiver"; exit 0; fi
          git commit -m "part187f paire ${{ matrix.tag }} : journaux et mesures

          Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_012qTVdBJ7QYur7BNLAidNKZ"
          ok=0
          for i in 1 2 3 4 5 6; do
            if git pull --rebase origin main && git push origin HEAD:main; then ok=1; break; fi
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 20 + 5))
          done
          if [ "$ok" != 1 ]; then echo "ECHEC du push apres 6 essais"; exit 1; fi
