name: PEW part184j test de resolution h=0.5 vs h=0.25, conservation de L (g2=0, omega=0.2)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  paires:
    name: part184j ${{ matrix.tag }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - {tag: S1_h05_g0,  h: '0.5',  n: '64',  nrel: '48', nb: '48', sepc: '10', dt: '0.02', g2: '0', om: '0.2', sj: opp, sq: opp, nu: '0.12', tend: '8'}
          - {tag: S2_h025_g0, h: '0.25', n: '128', nrel: '96', nb: '96', sepc: '20', dt: '0.01', g2: '0', om: '0.2', sj: opp, sq: opp, nu: '0.12', tend: '8'}
          - {tag: S3_h05_g002,  h: '0.5',  n: '64',  nrel: '48', nb: '48', sepc: '10', dt: '0.02', g2: '0.02', om: '0.2', sj: opp, sq: opp, nu: '0.12', tend: '8'}
          - {tag: S4_h025_g002, h: '0.25', n: '128', nrel: '96', nb: '96', sepc: '20', dt: '0.01', g2: '0.02', om: '0.2', sj: opp, sq: opp, nu: '0.12', tend: '8'}
    defaults:
      run:
        working-directory: numerical_minimization/protect3d_Z
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: numerical_minimization/protect3d_Z/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt scipy
      - name: Relaxe un noeud isole (N=48)
        env:
          N: ${{ matrix.nrel }}
          H: ${{ matrix.h }}
        run: python jauge.py relax ${{ matrix.nu }} relaxed.npy
      - name: Paire (resolution)
        env:
          N: ${{ matrix.n }}
          H: ${{ matrix.h }}
          NB: ${{ matrix.nb }}
          SEPC: ${{ matrix.sepc }}
          REXT: '10'
          RA1: '6'
          RA2: '11'
          RELAXED: relaxed.npy
          DT: ${{ matrix.dt }}
        run: python jauge.py pair ${{ matrix.nu }} ${{ matrix.g2 }} ${{ matrix.om }} ${{ matrix.tend }} ${{ matrix.tag }} ${{ matrix.sq }} ${{ matrix.sj }} | tee ${{ matrix.tag }}.log
      - name: Archive le journal dans resultats/part184
        if: always()
        working-directory: .
        run: |
          mkdir -p resultats/part184/gh_part184j
          cp numerical_minimization/protect3d_Z/${{ matrix.tag }}.log numerical_minimization/protect3d_Z/${{ matrix.tag }}_proj.npy resultats/part184/gh_part184j/ || true
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add resultats/part184/gh_part184j
          git commit -m "part184j paire ${{ matrix.tag }} : journal

          Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_012qTVdBcwjjMSGxvefBTrWg" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && break || sleep $((RANDOM % 20 + 5)); done
