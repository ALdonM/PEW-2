name: PEW part179 calibrage - noeud au viriel, bruit filtre, temoin T=0, refroidissement lent

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  wk_T0_c1:
    name: part179 wk_T0 chunk 1/3
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    outputs:
      finished: ${{ steps.check_done.outputs.finished }}
    defaults:
      run:
        working-directory: numerical_minimization/protect3d_Z
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: numerical_minimization/protect3d_Z/requirements.txt
      - name: Restore checkpoint
        uses: actions/cache@v4
        with:
          path: |
            numerical_minimization/protect3d_Z/ck_wk_T0.npz
            numerical_minimization/protect3d_Z/wk_T0_history.jsonl
            numerical_minimization/protect3d_Z/wk_T0_params.json
          key: p179-wk_T0-c1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            p179-wk_T0-
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run or resume
        env:
          MODE: 'lang'
          G0: '0.1'
          MU: '0.375'
          E0: '0.25'
          N: '64'
          H: '0.5'
          T0: '10'
          DT: '0.0025'
          SNAP: '1000'
          TIME_BUDGET: '19000'
          JAX_PLATFORM_NAME: 'cpu'
          OMP_NUM_THREADS: '4'
          BARRIER: '0'
          KC: '1.5'
          INIT: 'knot'
          RK: '5.0'
          G0R: '0.5'
          TON: '30'
          TQ: '0'
          T_END: '80'
          MEAS: '0.5'
          NOEUDS: '0'
          TSTART: '0.0'
          SEED: '1'
        run: python -u dyn.py wk_T0 2>&1 | tee run_wk_T0_c1.log
      - name: Check whether finished
        id: check_done
        shell: bash
        run: |
          python - <<'PYCODE'
          import json, os
          st = json.load(open('wk_T0_state.json')); print(st)
          open(os.environ['GITHUB_OUTPUT'], 'a').write('finished=' + ('true' if st['finished'] else 'false') + '\n')
          PYCODE
      - name: Commit results to resultats/
        if: always()
        shell: bash
        run: |
          OUT=../../resultats/part179/wk_T0; mkdir -p $OUT
          cp wk_T0_history.jsonl wk_T0_params.json wk_T0_state.json wk_T0_champ_final.npy $OUT/ 2>/dev/null || true
          cd ../..; git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resultats/part179/wk_T0; git commit -q -m 'part179 wk_T0 chunk 1 : resultats' || exit 0
          for i in $(seq 1 12); do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep $((RANDOM % 30 + 5)); done
