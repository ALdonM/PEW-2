      run:
        working-directory: numerical_minimization/protect3d_Z
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: numerical_minimization/protect3d_Z/requirements.txt
      - name: Restore checkpoint
        uses: actions/cache@v4
        with:
          path: |
            numerical_minimization/protect3d_Z/ck_ck_tq30_s2.npz
            numerical_minimization/protect3d_Z/ck_tq30_s2_history.jsonl
            numerical_minimization/protect3d_Z/ck_tq30_s2_params.json
          key: p179-ck_tq30_s2-c3-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            p179-ck_tq30_s2-
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run or resume
        env:
          MODE: 'lang'
          G0: '0.1'
          MU: '0.375'
          E0: '0.25'
          N: '64'
          H: '0.5'
          T0: '10'
          DT: '0.0025'
          SNAP: '1000'
          TIME_BUDGET: '19000'
          JAX_PLATFORM_NAME: 'cpu'
          OMP_NUM_THREADS: '4'
          BARRIER: '0'
          KC: '1.5'
          INIT: 'chaos'
          XI0: '2.0'
          RMS: '1.0'
          TSTART: '0.3'
          TLAW: 'exp'
          THOLD: '20'
          TON: '0'
          TQ: '30'
          T_END: '189'
          MEAS: '1.0'
          NOEUDS: '1'
          SEED: '2'
        run: python -u dyn.py ck_tq30_s2 2>&1 | tee run_ck_tq30_s2_c3.log
      - name: Check whether finished
        id: check_done
        shell: bash
        run: |
          python - <<'PYCODE'
          import json, os
          st = json.load(open('ck_tq30_s2_state.json')); print(st)
          open(os.environ['GITHUB_OUTPUT'], 'a').write('finished=' + ('true' if st['finished'] else 'false') + '\n')
          PYCODE
      - name: Commit results to resultats/
        if: always()
        shell: bash
        run: |
          OUT=../../resultats/part179/ck_tq30_s2; mkdir -p $OUT
          cp ck_tq30_s2_history.jsonl ck_tq30_s2_params.json ck_tq30_s2_state.json ck_tq30_s2_champ_final.npy $OUT/ 2>/dev/null || true
          cd ../..; git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resultats/part179/ck_tq30_s2; git commit -q -m 'part179 ck_tq30_s2 chunk 3 : resultats' || exit 0
          for i in $(seq 1 12); do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep $((RANDOM % 30 + 5)); done
