name: PEW part184u variantes de conditions initiales T long et boite N=128

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  relaxe96:
    name: relaxation N=96
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        working-directory: numerical_minimization/protect3d_Z
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: numerical_minimization/protect3d_Z/requirements.txt
      - run: python -m pip install -r requirements.txt scipy
      - name: Relaxe un noeud isole N=96 (120 unites)
        env:
          N: '96'
          H: '0.5'
          RELT: '120'
        run: python jauge.py relax 0.12 relaxed.npy | tee relax.log
      - uses: actions/upload-artifact@v4
        with:
          name: relaxed96
          path: numerical_minimization/protect3d_Z/relaxed.npy
  relaxe128:
    name: relaxation N=128
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        working-directory: numerical_minimization/protect3d_Z
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: numerical_minimization/protect3d_Z/requirements.txt
      - run: python -m pip install -r requirements.txt scipy
      - name: Relaxe un noeud isole N=128 (120 unites)
        env:
          N: '128'
          H: '0.5'
          RELT: '120'
        run: python jauge.py relax 0.12 relaxed.npy | tee relax.log
      - uses: actions/upload-artifact@v4
        with:
          name: relaxed128
          path: numerical_minimization/protect3d_Z/relaxed.npy
  pairesa:
    name: part184u-a ${{ matrix.tag }}
    needs: relaxe96
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - {tag: 'A1_zopp_g001_T90', g2: '0.01', om: '0.25', sj: opp, ori: z, cpz: '1', sepc: '20', tend: '90'}
          - {tag: 'A2_zopp_g002_sep19', g2: '0.02', om: '0.25', sj: opp, ori: z, cpz: '1', sepc: '19', tend: '70'}
          - {tag: 'A3_zopp_g002_sep21', g2: '0.02', om: '0.25', sj: opp, ori: z, cpz: '1', sepc: '21', tend: '70'}
          - {tag: 'A4_zopp_g002_om024', g2: '0.02', om: '0.24', sj: opp, ori: z, cpz: '1', sepc: '20', tend: '70'}
          - {tag: 'A5_zopp_g002_om026', g2: '0.02', om: '0.26', sj: opp, ori: z, cpz: '1', sepc: '20', tend: '70'}
          - {tag: 'A6_zopp_g001_sep19', g2: '0.01', om: '0.25', sj: opp, ori: z, cpz: '1', sepc: '19', tend: '90'}
          - {tag: 'A7_zopp_g001_sep21', g2: '0.01', om: '0.25', sj: opp, ori: z, cpz: '1', sepc: '21', tend: '90'}
          - {tag: 'A8_zopp_g0015_T90', g2: '0.015', om: '0.25', sj: opp, ori: z, cpz: '1', sepc: '20', tend: '90'}
    defaults:
      run:
        working-directory: numerical_minimization/protect3d_Z
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: numerical_minimization/protect3d_Z/requirements.txt
      - run: python -m pip install -r requirements.txt scipy
      - uses: actions/download-artifact@v4
        with:
          name: relaxed96
          path: numerical_minimization/protect3d_Z
      - name: Paire
        env:
          N: '96'
          H: '0.5'
          NB: '96'
          SEPC: ${{ matrix.sepc }}
          REXT: '22'
          RA1: '12'
          RA2: '22'
          D2: '0.001'
          GUARD: '1e-6'
          RELAXED: relaxed.npy
          DT: '0.02'
          ORIENT: ${{ matrix.ori }}
          CANCEL_PZ: ${{ matrix.cpz }}
          SEPD: '14'
        run: python jauge.py pair 0.12 ${{ matrix.g2 }} ${{ matrix.om }} ${{ matrix.tend }} ${{ matrix.tag }} opp ${{ matrix.sj }} | tee ${{ matrix.tag }}.log
      - name: Archive le journal dans resultats/part184
        if: always()
        working-directory: .
        run: |
          mkdir -p resultats/part184/gh_part184u_a
          cp numerical_minimization/protect3d_Z/${{ matrix.tag }}.log numerical_minimization/protect3d_Z/${{ matrix.tag }}_proj.npy resultats/part184/gh_part184u_a/ || true
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add resultats/part184/gh_part184u_a
          git commit -m "part184u paire ${{ matrix.tag }} : journal

          Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_012qTVdBJ7QYur7BNLAidNKZ" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && break || sleep $((RANDOM % 20 + 5)); done
  pairesb:
    name: part184u-b ${{ matrix.tag }}
    needs: relaxe128
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - {tag: 'B1_z_om000', g2: '0.02', om: '0.0', sj: opp, ori: z, cpz: '0', sepc: '20', tend: '70'}
          - {tag: 'B2_z_opp_cancel', g2: '0.02', om: '0.25', sj: opp, ori: z, cpz: '1', sepc: '20', tend: '70'}
          - {tag: 'B3_z_same_cancel', g2: '0.02', om: '0.25', sj: same, ori: z, cpz: '1', sepc: '20', tend: '70'}
          - {tag: 'B4_x_om000', g2: '0.02', om: '0.0', sj: opp, ori: x, cpz: '0', sepc: '20', tend: '70'}
          - {tag: 'B5_x_par_cancel', g2: '0.02', om: '0.25', sj: opp, ori: x, cpz: '1', sepc: '20', tend: '70'}
          - {tag: 'B6_x_anti_cancel', g2: '0.02', om: '0.25', sj: same, ori: x, cpz: '1', sepc: '20', tend: '70'}
          - {tag: 'B7_z_om000_g001', g2: '0.01', om: '0.0', sj: opp, ori: z, cpz: '0', sepc: '20', tend: '90'}
          - {tag: 'B8_z_opp_g001_cancel', g2: '0.01', om: '0.25', sj: opp, ori: z, cpz: '1', sepc: '20', tend: '90'}
    defaults:
      run:
        working-directory: numerical_minimization/protect3d_Z
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: numerical_minimization/protect3d_Z/requirements.txt
      - run: python -m pip install -r requirements.txt scipy
      - uses: actions/download-artifact@v4
        with:
          name: relaxed128
          path: numerical_minimization/protect3d_Z
      - name: Paire
        env:
          N: '128'
          H: '0.5'
          NB: '128'
          SEPC: ${{ matrix.sepc }}
          REXT: '22'
          RA1: '12'
          RA2: '22'
          D2: '0.001'
          GUARD: '1e-6'
          RELAXED: relaxed.npy
          DT: '0.02'
          ORIENT: ${{ matrix.ori }}
          CANCEL_PZ: ${{ matrix.cpz }}
          SEPD: '14'
        run: python jauge.py pair 0.12 ${{ matrix.g2 }} ${{ matrix.om }} ${{ matrix.tend }} ${{ matrix.tag }} opp ${{ matrix.sj }} | tee ${{ matrix.tag }}.log
      - name: Archive le journal dans resultats/part184
        if: always()
        working-directory: .
        run: |
          mkdir -p resultats/part184/gh_part184u_b
          cp numerical_minimization/protect3d_Z/${{ matrix.tag }}.log numerical_minimization/protect3d_Z/${{ matrix.tag }}_proj.npy resultats/part184/gh_part184u_b/ || true
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add resultats/part184/gh_part184u_b
          git commit -m "part184u paire ${{ matrix.tag }} : journal

          Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_012qTVdBJ7QYur7BNLAidNKZ" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && break || sleep $((RANDOM % 20 + 5)); done
