name: PEW eta12 balayage en pas deta (N240, N320, N480) PC + PC2

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  n240c01:
    name: PEW eta12 N240 PRECOND2 chunk 01/04
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    outputs:
      finished: ${{ steps.check_done.outputs.finished }}
    defaults:
      run:
        working-directory: numerical_minimization/eta12_N240pc2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: numerical_minimization/eta12_N240pc2/requirements.txt

      - name: Restore latest checkpoint and history
        uses: actions/cache@v4
        with:
          path: |
            numerical_minimization/eta12_N240pc2/free_eta12_N240pc2_checkpoint.npz
            numerical_minimization/eta12_N240pc2/f_free_eta12_N240pc2_ckpt.npy
            numerical_minimization/eta12_N240pc2/dchi_free_eta12_N240pc2_ckpt.npy
            numerical_minimization/eta12_N240pc2/free_eta12_N240pc2_state.json
            numerical_minimization/eta12_N240pc2/free_eta12_N240pc2_history.jsonl
          key: pew-eta12-n240pc2-${{ github.run_id }}-${{ github.run_attempt }}-chunk-01
          restore-keys: |
            pew-eta12-n240pc2-

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run or resume minimization
        env:
          JAX_PLATFORM_NAME: cpu
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '1'
          MAXITER: '50000'
          PC: '1'
          PC_ETA0: '8.0'
          PC2: '1'
          PC2_FLOOR: '1e-3'
          PC2_REF: 'ref_f12_N240.npy'
          TOTAL_MAXITER: '200000'
          CHECKPOINT_EVERY: '10000'
        run: python -u free_ar.py 12 240 start12pc2 eta12_N240pc2 | tee run.log

      - name: Check whether the global iteration limit was reached
        id: check_done
        shell: bash
        env:
          TOTAL_MAXITER: '200000'
        run: |
          python - <<'PYCODE'
          import json, os
          with open("free_eta12_N240pc2_state.json", encoding="utf-8") as f:
              state = json.load(f)
          nit = int(state["nit_ckpt"])
          limit = int(os.environ["TOTAL_MAXITER"])
          finished = nit >= limit
          print(f"Checkpoint cumulatif : {nit} / {limit}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"finished={'true' if finished else 'false'}\n")
          PYCODE

      - name: Preserve checkpoint and history artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PEW-eta12-N240pc2-checkpoint-chunk-01
          path: |
            numerical_minimization/eta12_N240pc2/free_eta12_N240pc2_checkpoint.npz
            numerical_minimization/eta12_N240pc2/*ckpt.npy
            numerical_minimization/eta12_N240pc2/*state.json
            numerical_minimization/eta12_N240pc2/*history.jsonl
            numerical_minimization/eta12_N240pc2/run.log
            numerical_minimization/eta12_N240pc2/LISEZMOI.txt
          if-no-files-found: warn
          retention-days: 30
