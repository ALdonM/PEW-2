name: PEW part187c ventilation par composante des champs relaxes (L32/48/64 + departs tournes)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  job:
    name: part187c composantes
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: numerical_minimization/protect3d_Z
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: numerical_minimization/protect3d_Z/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt "scipy>=1.15"
      - name: Champs relaxes du run 44312113969 (L32, L48, L64)
        uses: actions/download-artifact@v4
        with:
          run-id: 44312113969
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: champ_relaxe_*
          path: numerical_minimization/protect3d_Z/champs
      - name: Champs relaxes du run 44388962225 (departs tournes, L48)
        uses: actions/download-artifact@v4
        with:
          run-id: 44388962225
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: champ_relaxe_*
          path: numerical_minimization/protect3d_Z/champs
      - name: Ventilation par composante
        run: |
          ls -la champs/*
          for f in champs/*/relaxe_*.npy; do
            t=$(basename $f .npy); t=${t#relaxe_}
            python halo_composantes.py $f --h 0.5 --tag $t --out comp_$t.json | tee comp_$t.log
          done
      - name: Archive dans resultats/part187
        if: always()
        working-directory: .
        run: |
          mkdir -p resultats/part187
          cp numerical_minimization/protect3d_Z/comp_*.json comp_*.log resultats/part187/ 2>/dev/null || true
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add resultats/part187
          if git diff --cached --quiet; then echo "rien a archiver"; exit 0; fi
          git commit -m "part187c : ventilation de l'energie par composante (e_n, e_j, e_rho, e4, eV) a grand r

          Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_012qTVdDvagm9nsLTXYZ7x2G"
          ok=0
          for i in 1 2 3 4 5 6; do
            if git pull --rebase origin main && git push origin HEAD:main; then ok=1; break; fi
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 20 + 5))
          done
          if [ "$ok" != 1 ]; then echo "ECHEC du push apres 6 essais"; exit 1; fi
