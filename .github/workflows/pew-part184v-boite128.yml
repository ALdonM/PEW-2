name: PEW part184v boite N=128 relaxation en deux etapes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  relaxe128a:
    name: relaxation N=128 partie 1
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        working-directory: numerical_minimization/protect3d_Z
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: numerical_minimization/protect3d_Z/requirements.txt
      - run: python -m pip install -r requirements.txt scipy
      - name: Relaxation N=128 (60 unites)
        env:
          N: '128'
          H: '0.5'
          RELT: '60'
        run: python jauge.py relax 0.12 relaxed.npy | tee relax.log
      - uses: actions/upload-artifact@v4
        with:
          name: relax128a
          path: numerical_minimization/protect3d_Z/relaxed.npy
  relaxe128b:
    name: relaxation N=128 partie 2
    needs: relaxe128a
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        working-directory: numerical_minimization/protect3d_Z
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: numerical_minimization/protect3d_Z/requirements.txt
      - run: python -m pip install -r requirements.txt scipy
      - uses: actions/download-artifact@v4
        with:
          name: relax128a
          path: numerical_minimization/protect3d_Z
      - name: Relaxation N=128 (60 unites)
        env:
          N: '128'
          H: '0.5'
          RELT: '60'
          RELIN: relaxed.npy
        run: python jauge.py relax 0.12 relaxed2.npy | tee relax.log
      - uses: actions/upload-artifact@v4
        with:
          name: relaxed128
          path: numerical_minimization/protect3d_Z/relaxed2.npy
  pairesb:
    name: part184v-b ${{ matrix.tag }}
    needs: relaxe128b
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - {tag: 'B1_z_om000', g2: '0.02', om: '0.0', sj: opp, ori: z, cpz: '0', sepc: '20', tend: '60'}
          - {tag: 'B2_z_opp_cancel', g2: '0.02', om: '0.25', sj: opp, ori: z, cpz: '1', sepc: '20', tend: '60'}
          - {tag: 'B3_z_same_cancel', g2: '0.02', om: '0.25', sj: same, ori: z, cpz: '1', sepc: '20', tend: '60'}
          - {tag: 'B4_x_om000', g2: '0.02', om: '0.0', sj: opp, ori: x, cpz: '0', sepc: '20', tend: '60'}
          - {tag: 'B5_x_par_cancel', g2: '0.02', om: '0.25', sj: opp, ori: x, cpz: '1', sepc: '20', tend: '60'}
          - {tag: 'B6_x_anti_cancel', g2: '0.02', om: '0.25', sj: same, ori: x, cpz: '1', sepc: '20', tend: '60'}
          - {tag: 'B7_z_om000_g001', g2: '0.01', om: '0.0', sj: opp, ori: z, cpz: '0', sepc: '20', tend: '60'}
          - {tag: 'B8_z_opp_g001_cancel', g2: '0.01', om: '0.25', sj: opp, ori: z, cpz: '1', sepc: '20', tend: '60'}
    defaults:
      run:
        working-directory: numerical_minimization/protect3d_Z
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: numerical_minimization/protect3d_Z/requirements.txt
      - run: python -m pip install -r requirements.txt scipy
      - uses: actions/download-artifact@v4
        with:
          name: relaxed128
          path: numerical_minimization/protect3d_Z
      - name: Paire
        env:
          N: '128'
          H: '0.5'
          NB: '128'
          SEPC: ${{ matrix.sepc }}
          REXT: '22'
          RA1: '12'
          RA2: '22'
          D2: '0.001'
          GUARD: '1e-6'
          RELAXED: relaxed2.npy
          DT: '0.02'
          ORIENT: ${{ matrix.ori }}
          CANCEL_PZ: ${{ matrix.cpz }}
          SEPD: '14'
        run: python jauge.py pair 0.12 ${{ matrix.g2 }} ${{ matrix.om }} ${{ matrix.tend }} ${{ matrix.tag }} opp ${{ matrix.sj }} | tee ${{ matrix.tag }}.log
      - name: Archive le journal dans resultats/part184
        if: always()
        working-directory: .
        run: |
          mkdir -p resultats/part184/gh_part184v_b
          cp numerical_minimization/protect3d_Z/${{ matrix.tag }}.log numerical_minimization/protect3d_Z/${{ matrix.tag }}_proj.npy resultats/part184/gh_part184v_b/ || true
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add resultats/part184/gh_part184v_b
          git commit -m "part184v paire ${{ matrix.tag }} : journal

          Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_012qTVdBJ7QYur7BNLAidNKZ" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && break || sleep $((RANDOM % 20 + 5)); done
