name: PEW part213 noeuds Q_H=2 et temoin Q_H=1 (meme protocole, boite 48) pour Q1 seconde

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  halo:
    name: part213 ${{ matrix.tag }}
    runs-on: ubuntu-24.04
    timeout-minutes: 358
    strategy:
      fail-fast: false
      matrix:
        include:
          - {tag: Q1_nu012, a: '1', b: '1', nu: '0.12'}
          - {tag: Q2_nu012, a: '1', b: '2', nu: '0.12'}
          - {tag: Q2_nu0,   a: '1', b: '2', nu: '0.0'}
    defaults:
      run:
        shell: bash
        working-directory: numerical_minimization/protect3d_Z
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: numerical_minimization/protect3d_Z/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt "scipy>=1.15"
      - name: Champ initial de charge a*b
        run: python make_QH.py ${{ matrix.a }} ${{ matrix.b }} 96 0.5 7 2.5 init_${{ matrix.tag }}.npy
      - name: Relaxation (float64, L-BFGS-B)
        run: |
          python halo_relax.py --in init_${{ matrix.tag }}.npy --N 96 --h 0.5 --mu 0.375 --e0 0.25 --d2 1e-3 --nu ${{ matrix.nu }} \
            --maxit 4000 --save 250 --tmax 18000 --out relaxe_${{ matrix.tag }}.npy | tee relaxe_${{ matrix.tag }}.log
      - name: Mesure du halo et ventilation par composante
        if: always()
        run: |
          python halo_mesure.py relaxe_${{ matrix.tag }}.npy --h 0.5 --mu 0.375 --e0 0.25 --d2 1e-3 --nu ${{ matrix.nu }} --tag ${{ matrix.tag }} --out halo_${{ matrix.tag }}.json | tee halo_${{ matrix.tag }}.log
          python halo_composantes.py relaxe_${{ matrix.tag }}.npy --h 0.5 --e0 0.25 --nu ${{ matrix.nu }} --tag ${{ matrix.tag }} --out comp_${{ matrix.tag }}.json | tee comp_${{ matrix.tag }}.log
      - name: Champ relaxe en artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: champ_relaxe_${{ matrix.tag }}
          path: numerical_minimization/protect3d_Z/relaxe_${{ matrix.tag }}.npy
          retention-days: 30
      - name: Archive dans resultats/part213
        if: always()
        run: |
          mkdir -p ../../resultats/part213
          cp relaxe_${{ matrix.tag }}.log halo_${{ matrix.tag }}.* comp_${{ matrix.tag }}.* ../../resultats/part213/ 2>/dev/null || true
          cd ../..
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add resultats/part213
          if git diff --cached --quiet; then echo "rien a archiver"; exit 0; fi
          git commit -m "part213 ${{ matrix.tag }} : journaux et mesures

          Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_012qTVdE7fweMvxDdweHMqCg"
          ok=0
          for i in 1 2 3 4 5 6; do
            if git pull --rebase origin main && git push origin HEAD:main; then ok=1; break; fi
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 20 + 5))
          done
          if [ "$ok" != 1 ]; then echo "ECHEC du push apres 6 essais"; exit 1; fi
