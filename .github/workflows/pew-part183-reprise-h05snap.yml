name: PEW part183 reprise des runs h05snap de part182 avec diagnostic 3D reduit

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  h05snap_same_pi_x_s24_r1:
    name: part183 h05snap_same_pi_x_s24 reprise 1/2
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    outputs:
      finished: ${{ steps.check_done.outputs.finished }}
    defaults:
      run:
        working-directory: numerical_minimization/protect3d_Z
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: numerical_minimization/protect3d_Z/requirements.txt
      - name: Restore checkpoint
        uses: actions/cache@v4
        with:
          path: |
            numerical_minimization/protect3d_Z/ck_p182_h05snap_same_pi_x_s24.npz
            numerical_minimization/protect3d_Z/p182_h05snap_same_pi_x_s24_history.jsonl
            numerical_minimization/protect3d_Z/p182_h05snap_same_pi_x_s24_params.json
            numerical_minimization/protect3d_Z/p182_h05snap_same_pi_x_s24_proj.npy
          key: p183-h05snap_same_pi_x_s24-r1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            p183-h05snap_same_pi_x_s24-
            p182-h05snap_same_pi_x_s24-
      - name: Install dependencies
        run: python -m pip install -r requirements.txt scipy
      - name: Garde-fou - le checkpoint doit exister
        run: |
          test -f ck_p182_h05snap_same_pi_x_s24.npz || (echo "CHECKPOINT ABSENT : abandon pour ne pas relancer depuis t=0"; exit 1)
          python -c "import json; print(open('p182_h05snap_same_pi_x_s24_history.jsonl').read().strip().splitlines()[-1][:200])"
      - name: Fabrique la paire initiale
        run: python ../pairs_Z/make_pair.py pair_h05snap_same_pi_x_s24.npy 24 pi_x 0
      - name: Run or resume
        env:
          MODE: 'lang'
          G0: '0.0'
          G0R: '0.0'
          MU: '0.375'
          E0: '0.25'
          N: '128'
          H: '0.5'
          T0: '10'
          DT: '0.0025'
          SNAP: '2.5'
          TIME_BUDGET: '19000'
          JAX_PLATFORM_NAME: 'cpu'
          OMP_NUM_THREADS: '4'
          BARRIER: '0'
          INIT: 'file'
          TON: '0'
          T_END: '40'
          MEAS: '0.5'
          NOEUDS: '0'
          TSTART: '0.0'
          TQ: '0'
          SEED: '1'
          EINJ: '0'
          KC: '0'
          INIT_FILE: 'pair_h05snap_same_pi_x_s24.npy'
          NB: '128'
        run: python -u dyn.py p182_h05snap_same_pi_x_s24 2>&1 | tee run_p182_h05snap_same_pi_x_s24_r1.log
      - name: Check whether finished
        id: check_done
        shell: bash
        run: |
          python - <<'PYCODE'
          import json, os
          st = json.load(open('p182_h05snap_same_pi_x_s24_state.json')); print(st)
          open(os.environ['GITHUB_OUTPUT'], 'a').write('finished=' + ('true' if st['finished'] else 'false') + '\n')
          PYCODE
      - name: Diagnostic 3D reduit des instantanes
        if: always()
        continue-on-error: true
        run: |
          ls snap_p182_h05snap_same_pi_x_s24_t*.npy
          SIG=2.0 python snapdiag.py 0.5 p182_h05snap_same_pi_x_s24_snapdiag_s2.jsonl snap_p182_h05snap_same_pi_x_s24_t*.npy
          SIG=3.0 python snapdiag.py 0.5 p182_h05snap_same_pi_x_s24_snapdiag_s3.jsonl snap_p182_h05snap_same_pi_x_s24_t*.npy
      - name: Sauvegarde en artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p182_h05snap_same_pi_x_s24-r183c1
          path: |
            numerical_minimization/protect3d_Z/p182_h05snap_same_pi_x_s24_history.jsonl
            numerical_minimization/protect3d_Z/p182_h05snap_same_pi_x_s24_state.json
            numerical_minimization/protect3d_Z/p182_h05snap_same_pi_x_s24_champ_final.npy
            numerical_minimization/protect3d_Z/p182_h05snap_same_pi_x_s24_proj.npy
            numerical_minimization/protect3d_Z/p182_h05snap_same_pi_x_s24_snapdiag_s*.jsonl
            numerical_minimization/protect3d_Z/snap_p182_h05snap_same_pi_x_s24_t*.npy
          if-no-files-found: ignore
      - name: Commit results to resultats/
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          OUT=../../resultats/part182/p182_h05snap_same_pi_x_s24; mkdir -p $OUT
          cp p182_h05snap_same_pi_x_s24_history.jsonl p182_h05snap_same_pi_x_s24_params.json p182_h05snap_same_pi_x_s24_state.json p182_h05snap_same_pi_x_s24_proj.npy p182_h05snap_same_pi_x_s24_champ_final.npy $OUT/ 2>/dev/null || true
          cat p182_h05snap_same_pi_x_s24_snapdiag_s2.jsonl >> $OUT/p182_h05snap_same_pi_x_s24_snapdiag_s2.jsonl 2>/dev/null || true
          cat p182_h05snap_same_pi_x_s24_snapdiag_s3.jsonl >> $OUT/p182_h05snap_same_pi_x_s24_snapdiag_s3.jsonl 2>/dev/null || true
          cd ../..; git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resultats/part182/p182_h05snap_same_pi_x_s24; git commit -q -m 'part183 h05snap_same_pi_x_s24 reprise 1 : resultats' || exit 0
          ok=0; for i in $(seq 1 12); do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && ok=1 && break; git rebase --abort 2>/dev/null; sleep $((RANDOM % 30 + 5)); done
          test $ok = 1
