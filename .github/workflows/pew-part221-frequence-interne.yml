name: PEW part221 noeud Q1 nu=0.12 avec frequence interne omega (rotation de phase de Z2) puis chute libre dans une pente d amplitude de fond

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  relax:
    name: part221 relaxation omega
    runs-on: ubuntu-24.04
    timeout-minutes: 358
    defaults:
      run:
        working-directory: numerical_minimization/protect3d_Z
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: numerical_minimization/protect3d_Z/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt "scipy>=1.15"
      - name: Noeud Q1 nu=0.12 relaxe (part187e boite 48)
        uses: actions/download-artifact@v4
        with:
          name: champ_relaxe_nu012_L48_N96
          run-id: 44638347471
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: numerical_minimization/protect3d_Z/depart
      - name: Relaxation avec frequence interne (omega 0.06 puis 0.12 puis 0.15)
        run: |
          mkdir -p rot; cp depart/relaxe_nu012_L48_N96.npy rot/rot_Q1_w000.npy
          python -u relax_rot.py --in depart/relaxe_nu012_L48_N96.npy --N 96 --nu 0.12 --omegas 0.06,0.12,0.15 --maxit 3000 --tmax 4500 --tag rot_Q1 --outdir rot 2>&1 | tee relax_rot_Q1.log
      - name: Champs en artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rot_Q1
          path: numerical_minimization/protect3d_Z/rot
          retention-days: 30
      - name: Archive
        if: always()
        shell: bash
        run: |
          mkdir -p ../../resultats/part221/relax; cp relax_rot_Q1.log rot/rot_Q1_mesures.json ../../resultats/part221/relax/ 2>/dev/null || true
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cd ../..
          git add resultats/part221/relax; git commit -q -m 'part221 relaxation frequence interne' || exit 0
          ok=0; for i in $(seq 1 20); do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && ok=1 && break; git rebase --abort 2>/dev/null; sleep $((RANDOM % 30 + 5)); done
          test $ok = 1
  chute_w000_gp020:
    name: part221 chute w000_gp020
    needs: relax
    runs-on: ubuntu-24.04
    timeout-minutes: 358
    defaults:
      run:
        working-directory: numerical_minimization/protect3d_Z
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: numerical_minimization/protect3d_Z/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt "scipy>=1.15"
      - name: Noeud avec frequence interne
        uses: actions/download-artifact@v4
        with:
          name: rot_Q1
          path: numerical_minimization/protect3d_Z/rot
      - name: Depart float32
        run: python -c "import numpy as np; np.save('init96.npy', np.load('rot/rot_Q1_w000.npy').astype(np.float32))"
      - name: Chute libre
        env:
          N: '96'
          NB: '96'
          H: '0.5'
          E0: '0.25'
          DT: '0.005'
          T0: '0'
          MODE: 'hot'
          TC0: '1000000'
          TH: '0'
          TC: '0'
          TSTART_H: '0'
          G0: '0'
          WARM: '0'
          MU: '0.375'
          MEAS: '0.5'
          SNAP: '1000'
          TIME_BUDGET: '18900'
          JAX_PLATFORM_NAME: 'cpu'
          OMP_NUM_THREADS: '4'
          BARRIER: '0'
          NOEUDS: '0'
          KC: '0'
          SEED: '1'
          FINAL32: '1'
          CP: '0'
          MEANC: '0'
          SPR0: '18'
          SPRB: '24'
          SPSIG: '0.3'
          KW0: '1'
          WA: '1'
          WR: '1'
          WV: '1'
          KT: '1'
          KF: '1'
          NU: '0.12'
          GRAD: '0'
          T_END: '24'
          INIT: 'file'
          INIT_FILE: 'init96.npy'
          GRADA: '0.02'
          V0ROT: '0.0'
        run: python -u dyn186c.py p221_w000_gp020 2>&1 | tee run_p221_w000_gp020.log
      - name: Archive
        if: always()
        shell: bash
        run: |
          mkdir -p ../../resultats/part221/p221_w000_gp020; cp p221_w000_gp020_history.jsonl p221_w000_gp020_params.json p221_w000_gp020_state.json ../../resultats/part221/p221_w000_gp020/ 2>/dev/null || true
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cd ../..
          git add resultats/part221/p221_w000_gp020; git commit -q -m 'part221 chute w000_gp020' || exit 0
          ok=0; for i in $(seq 1 20); do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && ok=1 && break; git rebase --abort 2>/dev/null; sleep $((RANDOM % 30 + 5)); done
