name: PEW part210 regression lagcov contre E_seul de part187e

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  regress:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: numerical_minimization/protect3d_Z
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: numerical_minimization/protect3d_Z/requirements.txt
      - run: python -m pip install -r requirements.txt scipy
      - name: Telecharge le noeud relaxe de part187e
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 44638347471 -n champ_relaxe_nu012_L64_N128 --repo ALdonM/PEW-2 -D art187
      - name: Regression
        run: python -u regress187_210.py art187/relaxe_nu012_L64_N128.npy 2>&1 | tee regress187.log
      - name: Commit
        if: always()
        shell: bash
        run: |
          OUT=../../resultats/part210/regress187; mkdir -p $OUT; cp regress187_210.json regress187.log $OUT/ || true
          cd ../..; git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resultats/part210/regress187; git commit -q -m 'part210 regression 931.32' || exit 0
          ok=0; for i in $(seq 1 20); do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && ok=1 && break; git rebase --abort 2>/dev/null; sleep $((RANDOM % 30 + 5)); done; test $ok = 1
