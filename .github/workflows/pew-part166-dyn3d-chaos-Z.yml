name: PEW part166 dynamique 3D chaos d'ondes modele Z (expansion, friction, noeud insere)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  rad10_s1_c1:
    name: part166 rad10_s1 chunk 1/2
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    outputs:
      finished: ${{ steps.check_done.outputs.finished }}
    defaults:
      run:
        working-directory: numerical_minimization/dyn3d_chaos_Z
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: numerical_minimization/dyn3d_chaos_Z/requirements.txt
      - name: Restore checkpoint
        uses: actions/cache@v4
        with:
          path: |
            numerical_minimization/dyn3d_chaos_Z/ck_rad10_s1.npz
            numerical_minimization/dyn3d_chaos_Z/rad10_s1_history.jsonl
            numerical_minimization/dyn3d_chaos_Z/rad10_s1_params.json
            numerical_minimization/dyn3d_chaos_Z/snap_rad10_s1_*.npy
          key: p166-rad10_s1-c1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            p166-rad10_s1-
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run or resume
        env:
          N: '64'
          H: '0.5'
          MU: '0.125'
          E0: '0.125'
          XI0: '6.0'
          DT: '0.0025'
          MEAS: '1.0'
          SNAP: '10.0'
          TIME_BUDGET: '19800'
          JAX_PLATFORM_NAME: 'cpu'
          OMP_NUM_THREADS: '4'
          MODE: 'rad'
          T0: '10'
          T_END: '40'
          SEED: '1'
        run: python -u dyn.py rad10_s1 2>&1 | tee run_rad10_s1_c1.log
      - name: Check whether finished
        id: check_done
        shell: bash
        run: |
          python - <<'PYCODE'
          import json, os
          st = json.load(open('rad10_s1_state.json')); print(st)
          open(os.environ['GITHUB_OUTPUT'], 'a').write('finished=' + ('true' if st['finished'] else 'false') + '\n')
          PYCODE
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: part166-rad10_s1-chunk-1
          path: |
            numerical_minimization/dyn3d_chaos_Z/ck_rad10_s1.npz
            numerical_minimization/dyn3d_chaos_Z/rad10_s1_history.jsonl
            numerical_minimization/dyn3d_chaos_Z/rad10_s1_params.json
            numerical_minimization/dyn3d_chaos_Z/rad10_s1_state.json
            numerical_minimization/dyn3d_chaos_Z/snap_rad10_s1_*.npy
            numerical_minimization/dyn3d_chaos_Z/run_rad10_s1_c1.log
          if-no-files-found: warn
          retention-days: 90
