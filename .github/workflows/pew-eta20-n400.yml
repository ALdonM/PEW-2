name: PEW eta20 N400 long minimization

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  chunk01:
    name: PEW minimization chunk 01/10
    runs-on: ubuntu-latest
    timeout-minutes: 330
    outputs:
      finished: ${{ steps.check_done.outputs.finished }}
    defaults:
      run:
        working-directory: numerical_minimization/eta20_N400
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: numerical_minimization/eta20_N400/requirements.txt

      - name: Restore latest checkpoint and history
        uses: actions/cache@v4
        with:
          path: |
            numerical_minimization/eta20_N400/free_eta20_N400_checkpoint.npz
            numerical_minimization/eta20_N400/f_free_eta20_N400_ckpt.npy
            numerical_minimization/eta20_N400/dchi_free_eta20_N400_ckpt.npy
            numerical_minimization/eta20_N400/free_eta20_N400_state.json
            numerical_minimization/eta20_N400/free_eta20_N400_history.jsonl
          key: pew-eta20-n400-${{ github.run_id }}-${{ github.run_attempt }}-chunk-01
          restore-keys: |
            pew-eta20-n400-

      - name: Check whether a checkpoint is present
        id: checkpoint_check
        shell: bash
        run: |
          if [[ -f free_eta20_N400_checkpoint.npz || ( -f f_free_eta20_N400_ckpt.npy && -f dchi_free_eta20_N400_ckpt.npy && -f free_eta20_N400_state.json ) ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bootstrap from the known successful run #4 artifact
        if: steps.checkpoint_check.outputs.present != 'true'
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 38563777852
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: PEW-eta20-N400-checkpoint-and-history
          path: numerical_minimization/eta20_N400

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run or resume minimization
        env:
          JAX_PLATFORM_NAME: cpu
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '1'
          MAXITER: '100000'
          TOTAL_MAXITER: '1000000'
          CHECKPOINT_EVERY: '10000'
        run: python -u free_ar.py 20 400 eta20_init eta20_N400 | tee run.log

      - name: Check whether the global iteration limit was reached
        id: check_done
        shell: bash
        env:
          TOTAL_MAXITER: '1000000'
        run: |
          python - <<'PYCODE'
          import json, os
          with open("free_eta20_N400_state.json", encoding="utf-8") as f:
              state = json.load(f)
          nit = int(state["nit_ckpt"])
          limit = int(os.environ["TOTAL_MAXITER"])
          finished = nit >= limit
          print(f"Checkpoint cumulatif : {nit} / {limit}")
          print(f"Plafond atteint : {finished}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"finished={'true' if finished else 'false'}\n")
          PYCODE

      - name: Preserve checkpoint and history artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PEW-eta20-N400-checkpoint-chunk-01
          path: |
            numerical_minimization/eta20_N400/free_eta20_N400_checkpoint.npz
            numerical_minimization/eta20_N400/*ckpt.npy
            numerical_minimization/eta20_N400/*state.json
            numerical_minimization/eta20_N400/*history.jsonl
            numerical_minimization/eta20_N400/run.log
            numerical_minimization/eta20_N400/LISEZMOI.txt
          if-no-files-found: warn
          retention-days: 30
