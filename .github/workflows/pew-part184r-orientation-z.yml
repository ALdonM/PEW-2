name: PEW part184r paire le long de laxe du spin z et balayage g2 fin

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  relaxe:
    name: relaxation N=96
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        working-directory: numerical_minimization/protect3d_Z
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: numerical_minimization/protect3d_Z/requirements.txt
      - run: python -m pip install -r requirements.txt scipy
      - name: Relaxe un noeud isole N=96 (120 unites)
        env:
          N: '96'
          H: '0.5'
          RELT: '120'
        run: python jauge.py relax 0.12 relaxed.npy | tee relax.log
      - uses: actions/upload-artifact@v4
        with:
          name: relaxed
          path: numerical_minimization/protect3d_Z/relaxed.npy
  paires:
    name: part184r ${{ matrix.tag }}
    needs: relaxe
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - {tag: R_z_om000, g2: '0.02', om: '0.0', sj: opp, ori: z}
          - {tag: R_z_om025sj_same, g2: '0.02', om: '0.25', sj: same, ori: z}
          - {tag: R_z_om025sj_opp, g2: '0.02', om: '0.25', sj: opp, ori: z}
          - {tag: R_x_g0015_om000, g2: '0.015', om: '0.0', sj: opp, ori: x}
          - {tag: R_x_g0015_om025par, g2: '0.015', om: '0.25', sj: opp, ori: x}
          - {tag: R_x_g003_om000, g2: '0.03', om: '0.0', sj: opp, ori: x}
          - {tag: R_x_g003_om025par, g2: '0.03', om: '0.25', sj: opp, ori: x}
          - {tag: R_x_g002_om025anti, g2: '0.02', om: '0.25', sj: same, ori: x}
    defaults:
      run:
        working-directory: numerical_minimization/protect3d_Z
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: numerical_minimization/protect3d_Z/requirements.txt
      - run: python -m pip install -r requirements.txt scipy
      - uses: actions/download-artifact@v4
        with:
          name: relaxed
          path: numerical_minimization/protect3d_Z
      - name: Paire (noeud relaxe N=96, sep 20, g2=0.02)
        env:
          N: '96'
          H: '0.5'
          NB: '96'
          SEPC: '20'
          REXT: '22'
          RA1: '12'
          RA2: '22'
          D2: '0.001'
          GUARD: '1e-6'
          RELAXED: relaxed.npy
          ORIENT: ${{ matrix.ori }}
          DT: '0.02'
        run: python jauge.py pair 0.12 ${{ matrix.g2 }} ${{ matrix.om }} 45 ${{ matrix.tag }} opp ${{ matrix.sj }} | tee ${{ matrix.tag }}.log
      - name: Archive le journal dans resultats/part184
        if: always()
        working-directory: .
        run: |
          mkdir -p resultats/part184/gh_part184r
          cp numerical_minimization/protect3d_Z/${{ matrix.tag }}.log numerical_minimization/protect3d_Z/${{ matrix.tag }}_proj.npy resultats/part184/gh_part184r/ || true
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add resultats/part184/gh_part184r
          git commit -m "part184r paire ${{ matrix.tag }} : journal

          Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_012qTVdBJ7QYur7BNLAidNKZ" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && break || sleep $((RANDOM % 20 + 5)); done
