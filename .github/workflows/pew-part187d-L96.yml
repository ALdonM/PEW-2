name: PEW part187d halo L=96 (N=192), depart chaud depuis le champ relaxe L=64

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  job:
    name: part187d L96_N192
    runs-on: ubuntu-24.04
    timeout-minutes: 358
    defaults:
      run:
        shell: bash
        working-directory: numerical_minimization/protect3d_Z
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: numerical_minimization/protect3d_Z/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt "scipy>=1.15"
      - name: Champ relaxe L64 (run 44312113969)
        uses: actions/download-artifact@v4
        with:
          run-id: 44312113969
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: champ_relaxe_L64_N128
          path: numerical_minimization/protect3d_Z/champs
      - name: Relaxation N=192 (float64, tranches de 12, maxcor 4, arret propre a 5h30)
        run: |
          python halo_relax.py --in champs/relaxe_L64_N128.npy --N 192 --h 0.5 --mu 0.375 --e0 0.25 --d2 1e-3 \
            --slab 12 --taper 22,30 --maxcor 4 --maxit 5000 --save 50 --tmax 19800 --no-degree --out relaxe_L96_N192.npy | tee relaxe_L96_N192.log
      - name: Mesure du halo
        if: always()
        run: |
          python halo_mesure.py relaxe_L96_N192.npy --h 0.5 --mu 0.375 --e0 0.25 --d2 1e-3 --tag L96_N192 --out halo_L96_N192.json | tee halo_L96_N192.log
          python halo_composantes.py relaxe_L96_N192.npy --h 0.5 --tag L96_N192 --out comp_L96_N192.json | tee comp_L96_N192.log
      - name: Champ relaxe en artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: champ_relaxe_L96_N192
          path: numerical_minimization/protect3d_Z/relaxe_L96_N192.npy
          retention-days: 30
      - name: Archive dans resultats/part187
        if: always()
        working-directory: .
        run: |
          mkdir -p resultats/part187
          cp numerical_minimization/protect3d_Z/relaxe_L96_N192.log halo_L96_N192.* comp_L96_N192.* resultats/part187/ 2>/dev/null || true
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add resultats/part187
          if git diff --cached --quiet; then echo "rien a archiver"; exit 0; fi
          git commit -m "part187d : halo L=96 (N=192), depart chaud depuis L64

          Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_012qTVdDvagm9nsLTXYZ7x2G"
          ok=0
          for i in 1 2 3 4 5 6; do
            if git pull --rebase origin main && git push origin HEAD:main; then ok=1; break; fi
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 20 + 5))
          done
          if [ "$ok" != 1 ]; then echo "ECHEC du push apres 6 essais"; exit 1; fi
