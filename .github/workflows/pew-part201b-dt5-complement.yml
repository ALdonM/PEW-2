name: PEW part201b complement dt=0.005 (palier 1)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  same_kf1_dt5:
    name: part201 same_kf1_dt5
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    defaults:
      run:
        working-directory: numerical_minimization/protect3d_Z
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: numerical_minimization/protect3d_Z/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt scipy
      - name: Depart
        run: python make_pair201.py init96.npy 24 0
      - name: Run
        env:
          N: '96'
          NB: '96'
          H: '0.5'
          E0: '0.25'
          T0: '0'
          MODE: 'hot'
          TC0: '1000000'
          TH: '0'
          TC: '0'
          TSTART_H: '0'
          G0: '0'
          WARM: '0'
          MU: '0.375'
          MEAS: '0.5'
          SNAP: '1000'
          TIME_BUDGET: '18900'
          JAX_PLATFORM_NAME: 'cpu'
          OMP_NUM_THREADS: '4'
          BARRIER: '0'
          NOEUDS: '0'
          KC: '0'
          SEED: '1'
          FINAL32: '1'
          CP: '0'
          MEANC: '0'
          SPR0: '18'
          SPRB: '24'
          SPSIG: '0.3'
          KW0: '1'
          WA: '1'
          WR: '1'
          WV: '1'
          KT: '1'
          NU: '0'
          T_END: '24'
          INIT: 'file'
          INIT_FILE: 'init96.npy'
          KF: '1'
          DT: '0.005'
        run: python -u dyn186c.py p201_same_kf1_dt5 2>&1 | tee run_p201_same_kf1_dt5.log
      - name: Commit results to resultats/
        if: always()
        shell: bash
        run: |
          OUT=../../resultats/part201/p201_same_kf1_dt5; mkdir -p $OUT
          cp p201_same_kf1_dt5_history.jsonl p201_same_kf1_dt5_params.json p201_same_kf1_dt5_state.json p201_same_kf1_dt5_proj.npy p201_same_kf1_dt5_champ_final.npy $OUT/ || true
          cd ../..; git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resultats/part201/p201_same_kf1_dt5; git commit -q -m 'part201 same_kf1_dt5 : resultats' || exit 0
          ok=0; for i in $(seq 1 20); do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && ok=1 && break; git rebase --abort 2>/dev/null; sleep $((RANDOM % 30 + 5)); done
          test $ok = 1
