name: PEW part218 chute libre dans une pente d amplitude de fond g=+0.02 et -0.02 avec houle normale (wr=1) et rigidifiee (wr=5 et 25)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  Q1_wr1_gp020:
    name: part218 Q1_wr1_gp020
    runs-on: ubuntu-24.04
    timeout-minutes: 358
    defaults:
      run:
        working-directory: numerical_minimization/protect3d_Z
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: numerical_minimization/protect3d_Z/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt "scipy>=1.15"
      - name: Noeud de depart
        uses: actions/download-artifact@v4
        with:
          name: champ_relaxe_L48_N96
          run-id: 44312113969
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: numerical_minimization/protect3d_Z/depart
      - name: Depart en float32
        run: python -c "import numpy as np; np.save('init96.npy', np.load('depart/relaxe_L48_N96.npy').astype(np.float32))"
      - name: Chute libre
        env:
          N: '96'
          NB: '96'
          H: '0.5'
          E0: '0.25'
          DT: '0.005'
          T0: '0'
          MODE: 'hot'
          TC0: '1000000'
          TH: '0'
          TC: '0'
          TSTART_H: '0'
          G0: '0'
          WARM: '0'
          MU: '0.375'
          MEAS: '0.5'
          SNAP: '1000'
          TIME_BUDGET: '18900'
          JAX_PLATFORM_NAME: 'cpu'
          OMP_NUM_THREADS: '4'
          BARRIER: '0'
          NOEUDS: '0'
          KC: '0'
          SEED: '1'
          FINAL32: '1'
          CP: '0'
          MEANC: '0'
          SPR0: '18'
          SPRB: '24'
          SPSIG: '0.3'
          KW0: '1'
          WA: '1'
          WR: '1'
          WV: '1'
          KT: '1'
          KF: '1'
          NU: '0'
          GRAD: '0'
          T_END: '24'
          GRADA: '0.02'
          INIT: 'file'
          INIT_FILE: 'init96.npy'
        run: python -u dyn186c.py p218_Q1_wr1_gp020 2>&1 | tee run_p218_Q1_wr1_gp020.log
      - name: Archive
        if: always()
        shell: bash
        run: |
          OUT=../../resultats/part218/p218_Q1_wr1_gp020; mkdir -p $OUT
          cp p218_Q1_wr1_gp020_history.jsonl p218_Q1_wr1_gp020_params.json p218_Q1_wr1_gp020_state.json relaxe_p218_Q1_wr1_gp020.log inertie_p218_Q1_wr1_gp020.* $OUT/ 2>/dev/null || true
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cd ../..
          git add resultats/part218/p218_Q1_wr1_gp020; git commit -q -m 'part218 Q1_wr1_gp020 : chute dans une pente d amplitude de fond

          Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_012qTVdE7fweMvxDdweHMqCg' || exit 0
          ok=0; for i in $(seq 1 20); do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && ok=1 && break; git rebase --abort 2>/dev/null; sleep $((RANDOM % 30 + 5)); done
