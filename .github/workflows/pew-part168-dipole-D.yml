name: PEW part168 dipole de courant de phase D du noeud de Hopf (modele Z)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: part168-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  n64_k0_fresh_c1:
    name: part168 n64_k0_fresh chunk 1/3
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    outputs:
      finished: ${{ steps.check_done.outputs.finished }}
    defaults:
      run:
        working-directory: numerical_minimization/dipole_D_Z
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: numerical_minimization/dipole_D_Z/requirements.txt
      - name: Restore checkpoint
        uses: actions/cache@v4
        with:
          path: |
            numerical_minimization/dipole_D_Z/ck_n64_k0_fresh.npz
            numerical_minimization/dipole_D_Z/n64_k0_fresh_history.jsonl
            numerical_minimization/dipole_D_Z/n64_k0_fresh_params.json
          key: p168-n64_k0_fresh-c1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            p168-n64_k0_fresh-
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run or resume
        env:
          H: '0.5'
          MU: '0.125'
          E0: '0.125'
          MAXITER: '1000000'
          TIME_BUDGET: '19000'
          CK: '200'
          JAX_PLATFORM_NAME: 'cpu'
          OMP_NUM_THREADS: '4'
          N: '64'
          INIT: 'fresh'
        run: python -u relaxD.py n64_k0_fresh 2>&1 | tee run_n64_k0_fresh_c1.log
      - name: Check whether finished
        id: check_done
        shell: bash
        run: |
          python - <<'PYCODE'
          import json, os
          st = json.load(open('n64_k0_fresh_state.json')); print(st)
          open(os.environ['GITHUB_OUTPUT'], 'a').write('finished=' + ('true' if st['finished'] else 'false') + '\n')
          PYCODE
      - name: Commit results to resultats/
        if: always()
        shell: bash
        run: |
          OUT=../../resultats/part168/n64_k0_fresh; mkdir -p $OUT
          cp n64_k0_fresh_history.jsonl n64_k0_fresh_state.json n64_k0_fresh_params.json run_n64_k0_fresh_c1.log $OUT/ 2>/dev/null || true
          python - <<'PYCODE'
          import json, numpy as np
          st = json.load(open('n64_k0_fresh_state.json'))
          if st['finished'] or 1 == 3:
              z = np.load('ck_n64_k0_fresh.npz'); n = round((z['x'].size / 4) ** (1 / 3))
              np.save('../../resultats/part168/n64_k0_fresh/champ_final.npy', z['x'].reshape(4, n, n, n).astype(np.float32 if n <= 64 else np.float16))
          PYCODE
          cd ../..; git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resultats/part168/n64_k0_fresh; git commit -q -m 'part168 n64_k0_fresh chunk 1 : resultats' || exit 0
          for i in 1 2 3 4 5 6; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep $((RANDOM % 20 + 5)); done
