name: PEW part184ze omega 0,10 relaxation avec jauge N128 et paires z

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  relax128s1:
    name: relaxation avec jauge omega 0,10 N128 etape 1/4 (25 unites)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    defaults:
      run:
        working-directory: numerical_minimization/protect3d_Z
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: numerical_minimization/protect3d_Z/requirements.txt
      - run: python -m pip install -r requirements.txt scipy
      - uses: actions/download-artifact@v4
        with:
          name: relaxed128n
          path: numerical_minimization/protect3d_Z
          run-id: '44638873798'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: relaxation avec jauge omega 0,10 N128 etape 1/4 (25 unites)
        env:
          N: '128'
          H: '0.5'
          RELT: '25'
          OMREL: '0.10'
          RG2: '0.02'
          RELIN: relaxed.npy
        run: python jauge.py relax 0.12 relaxedg.npy | tee relax_G010_N128_s1.log
      - uses: actions/upload-artifact@v4
        with:
          name: relaxedg128b_s1
          path: |
            numerical_minimization/protect3d_Z/relaxedg.npy
            numerical_minimization/protect3d_Z/relaxedg_state.npz
          if-no-files-found: ignore
      - name: Archive dans resultats/part184
        if: always()
        working-directory: .
        run: |
          mkdir -p resultats/part184/gh_part184ze
          cp numerical_minimization/protect3d_Z/relax_G010_N128_s1.log resultats/part184/gh_part184ze/ || true
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add resultats/part184/gh_part184ze
          git commit -m "part184ze relaxation avec jauge omega 0,10 N128 etape 1/4 (25 unites) : journal

          Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_012qTVdBqQanp7VoG9CMMcjx" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && break || sleep $((RANDOM % 20 + 5)); done
  relax128s2:
    name: relaxation avec jauge omega 0,10 N128 etape 2/4 (25 unites)
    needs: relax128s1
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    defaults:
      run:
        working-directory: numerical_minimization/protect3d_Z
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: numerical_minimization/protect3d_Z/requirements.txt
      - run: python -m pip install -r requirements.txt scipy
      - uses: actions/download-artifact@v4
        with:
          name: relaxedg128b_s1
          path: numerical_minimization/protect3d_Z
      - name: relaxation avec jauge omega 0,10 N128 etape 2/4 (25 unites)
        env:
          N: '128'
          H: '0.5'
          RELT: '25'
          OMREL: '0.10'
          RG2: '0.02'
          RELIN: relaxedg.npy
          RELST: relaxedg_state.npz
        run: python jauge.py relax 0.12 relaxedg.npy | tee relax_G010_N128_s2.log
      - uses: actions/upload-artifact@v4
        with:
          name: relaxedg128b_s2
          path: |
            numerical_minimization/protect3d_Z/relaxedg.npy
            numerical_minimization/protect3d_Z/relaxedg_state.npz
          if-no-files-found: ignore
      - name: Archive dans resultats/part184
        if: always()
        working-directory: .
        run: |
          mkdir -p resultats/part184/gh_part184ze
          cp numerical_minimization/protect3d_Z/relax_G010_N128_s2.log resultats/part184/gh_part184ze/ || true
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add resultats/part184/gh_part184ze
          git commit -m "part184ze relaxation avec jauge omega 0,10 N128 etape 2/4 (25 unites) : journal

          Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_012qTVdBqQanp7VoG9CMMcjx" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && break || sleep $((RANDOM % 20 + 5)); done
  relax128s3:
    name: relaxation avec jauge omega 0,10 N128 etape 3/4 (25 unites)
    needs: relax128s2
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    defaults:
      run:
        working-directory: numerical_minimization/protect3d_Z
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: numerical_minimization/protect3d_Z/requirements.txt
      - run: python -m pip install -r requirements.txt scipy
      - uses: actions/download-artifact@v4
        with:
          name: relaxedg128b_s2
          path: numerical_minimization/protect3d_Z
      - name: relaxation avec jauge omega 0,10 N128 etape 3/4 (25 unites)
        env:
          N: '128'
          H: '0.5'
          RELT: '25'
          OMREL: '0.10'
          RG2: '0.02'
          RELIN: relaxedg.npy
          RELST: relaxedg_state.npz
        run: python jauge.py relax 0.12 relaxedg.npy | tee relax_G010_N128_s3.log
      - uses: actions/upload-artifact@v4
        with:
          name: relaxedg128b_s3
          path: |
            numerical_minimization/protect3d_Z/relaxedg.npy
            numerical_minimization/protect3d_Z/relaxedg_state.npz
          if-no-files-found: ignore
      - name: Archive dans resultats/part184
        if: always()
        working-directory: .
        run: |
          mkdir -p resultats/part184/gh_part184ze
          cp numerical_minimization/protect3d_Z/relax_G010_N128_s3.log resultats/part184/gh_part184ze/ || true
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add resultats/part184/gh_part184ze
          git commit -m "part184ze relaxation avec jauge omega 0,10 N128 etape 3/4 (25 unites) : journal

          Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_012qTVdBqQanp7VoG9CMMcjx" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && break || sleep $((RANDOM % 20 + 5)); done
  relax128s4:
    name: relaxation avec jauge omega 0,10 N128 etape 4/4 (25 unites)
    needs: relax128s3
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    defaults:
      run:
        working-directory: numerical_minimization/protect3d_Z
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: numerical_minimization/protect3d_Z/requirements.txt
      - run: python -m pip install -r requirements.txt scipy
      - uses: actions/download-artifact@v4
        with:
          name: relaxedg128b_s3
          path: numerical_minimization/protect3d_Z
      - name: relaxation avec jauge omega 0,10 N128 etape 4/4 (25 unites)
        env:
          N: '128'
          H: '0.5'
          RELT: '25'
          OMREL: '0.10'
          RG2: '0.02'
          RELIN: relaxedg.npy
          RELST: relaxedg_state.npz
        run: python jauge.py relax 0.12 relaxedg.npy | tee relax_G010_N128_s4.log
      - uses: actions/upload-artifact@v4
        with:
          name: relaxedg128b_s4
          path: |
            numerical_minimization/protect3d_Z/relaxedg.npy
            numerical_minimization/protect3d_Z/relaxedg_state.npz
          if-no-files-found: ignore
      - name: Archive dans resultats/part184
        if: always()
        working-directory: .
        run: |
          mkdir -p resultats/part184/gh_part184ze
          cp numerical_minimization/protect3d_Z/relax_G010_N128_s4.log resultats/part184/gh_part184ze/ || true
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add resultats/part184/gh_part184ze
          git commit -m "part184ze relaxation avec jauge omega 0,10 N128 etape 4/4 (25 unites) : journal

          Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_012qTVdBqQanp7VoG9CMMcjx" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && break || sleep $((RANDOM % 20 + 5)); done
  paires128g:
    name: part184ze N128 jauge ${{ matrix.tag }}
    needs: relax128s4
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - {tag: ZDG128_zJs_om10, art: relaxedg128b_s4, rid: '${{ github.run_id }}', om: '0.10', sj: same, ori: z, g2: '0.02', st: 'relaxedg_state.npz'}
          - {tag: ZDG128_zJo_om10, art: relaxedg128b_s4, rid: '${{ github.run_id }}', om: '0.10', sj: opp, ori: z, g2: '0.02', st: 'relaxedg_state.npz'}
    defaults:
      run:
        working-directory: numerical_minimization/protect3d_Z
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: numerical_minimization/protect3d_Z/requirements.txt
      - run: python -m pip install -r requirements.txt scipy
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.art }}
          path: numerical_minimization/protect3d_Z
          run-id: ${{ matrix.rid }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Paire (profil de charge QPROF et courant au plan median QCUR)
        env:
          N: '128'
          H: '0.5'
          NB: '128'
          SEPC: '20'
          REXT: '22'
          RA1: '12'
          RA2: '22'
          D2: '0.001'
          GUARD: '1e-6'
          DT: '0.02'
          ORIENT: ${{ matrix.ori }}
          VPROD: '1'
          QPROF: '1'
          QCUR: '1'
          STATE: ${{ matrix.st }}
        run: |
          if [ -f relaxedg.npy ]; then export RELAXED=relaxedg.npy; else export RELAXED=relaxed.npy; fi
          if [ -z "$STATE" ]; then unset STATE; fi
          python jauge.py pair 0.12 ${{ matrix.g2 }} ${{ matrix.om }} 60 ${{ matrix.tag }} opp ${{ matrix.sj }} | tee ${{ matrix.tag }}.log
      - name: Archive dans resultats/part184
        if: always()
        working-directory: .
        run: |
          mkdir -p resultats/part184/gh_part184ze
          cp numerical_minimization/protect3d_Z/${{ matrix.tag }}.log resultats/part184/gh_part184ze/ || true
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add resultats/part184/gh_part184ze
          git commit -m "part184ze paire ${{ matrix.tag }} : journal

          Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_012qTVdBqQanp7VoG9CMMcjx" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && break || sleep $((RANDOM % 20 + 5)); done
