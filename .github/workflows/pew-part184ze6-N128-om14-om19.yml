      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: numerical_minimization/protect3d_Z/requirements.txt
      - run: python -m pip install -r requirements.txt scipy
      - uses: actions/download-artifact@v4
        with:
          name: relaxed128n
          path: numerical_minimization/protect3d_Z
          run-id: '44638873798'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: relaxation avec jauge
        env:
          N: '128'
          H: '0.5'
          RELT: '25'
          OMREL: '0.14'
          RG2: '0.02'
          RELIN: relaxed.npy
        run: python jauge.py relax 0.12 relaxedg.npy | tee relax_G014_N128_s1.log
      - uses: actions/upload-artifact@v4
        with:
          name: relaxedg128c_s1
          path: |
            numerical_minimization/protect3d_Z/relaxedg.npy
            numerical_minimization/protect3d_Z/relaxedg_state.npz
          if-no-files-found: error
      - name: Archive dans resultats/part184
        if: always()
        working-directory: .
        run: |
          mkdir -p resultats/part184/gh_part184ze
          cp numerical_minimization/protect3d_Z/relax_G014_N128_s1.log resultats/part184/gh_part184ze/ || true
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add resultats/part184/gh_part184ze
          git commit -m "part184ze6 relaxation jauge omega 0,14 N128 etape 1/4 : journal

