name: PEW part220 chute libre de Q1 Q2 Q3 en boite 64 (N=128) pour tester un artefact de boite

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  chute_Q1:
    name: part220 chute Q1 boite 64
    runs-on: ubuntu-24.04
    timeout-minutes: 358
    defaults:
      run:
        working-directory: numerical_minimization/protect3d_Z
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: numerical_minimization/protect3d_Z/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt scipy
      - name: Noeud relaxe en boite 64 (part215)
        uses: actions/download-artifact@v4
        with:
          name: champ_relaxe_Q1_nu0_L64
          run-id: 45895033007
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: numerical_minimization/protect3d_Z/depart
      - name: Depart en float32
        run: python -c "import numpy as np; np.save('init128.npy', np.load('depart/relaxe_Q1_nu0_L64.npy').astype(np.float32))"
      - name: Chute libre boite 64
        env:
          N: '128'
          NB: '128'
          H: '0.5'
          E0: '0.25'
          DT: '0.005'
          T0: '0'
          MODE: 'hot'
          TC0: '1000000'
          TH: '0'
          TC: '0'
          TSTART_H: '0'
          G0: '0'
          WARM: '0'
          MU: '0.375'
          MEAS: '1.0'
          SNAP: '1000'
          TIME_BUDGET: '20500'
          JAX_PLATFORM_NAME: 'cpu'
          OMP_NUM_THREADS: '4'
          BARRIER: '0'
          NOEUDS: '0'
          KC: '0'
          SEED: '1'
          FINAL32: '1'
          CP: '0'
          MEANC: '0'
          SPR0: '24'
          SPRB: '32'
          SPSIG: '0.3'
          KW0: '1'
          WA: '1'
          WR: '1'
          WV: '1'
          KT: '1'
          KF: '1'
          NU: '0'
          GRAD: '0'
          T_END: '24'
          GRADA: '0.02'
          INIT: 'file'
          INIT_FILE: 'init128.npy'
        run: python -u dyn186c.py p220_Q1_L64 2>&1 | tee run_p220_Q1_L64.log
      - name: Archive
        if: always()
        shell: bash
        run: |
          OUT=../../resultats/part220/p220_Q1_L64; mkdir -p $OUT
          cp p220_Q1_L64_history.jsonl p220_Q1_L64_params.json p220_Q1_L64_state.json $OUT/ || true
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cd ../..
          git add resultats/part220/p220_Q1_L64; git commit -q -m 'part220 Q1 : chute en boite 64' || exit 0
          ok=0; for i in $(seq 1 20); do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && ok=1 && break; git rebase --abort 2>/dev/null; sleep $((RANDOM % 30 + 5)); done
          test $ok = 1
