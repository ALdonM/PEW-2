name: PEW part184h impulsion axiale annulee (CANCEL_PZ) : separation spin / orbital, omega 0.2-0.3 (paire sur x, N=96 T=38)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  paires:
    name: part184h ${{ matrix.tag }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - {tag: Q1_om02_Jopp_cancel,  sj: opp,  om: '0.2', cz: '1', g2: '0.02', sq: opp, nu: '0.12', dt: '0.02', tend: '38'}
          - {tag: Q2_om03_Jopp_cancel,  sj: opp,  om: '0.3', cz: '1', g2: '0.02', sq: opp, nu: '0.12', dt: '0.02', tend: '38'}
          - {tag: Q3_om03_Jsame_cancel, sj: same, om: '0.3', cz: '1', g2: '0.02', sq: opp, nu: '0.12', dt: '0.02', tend: '38'}
          - {tag: Q4_om03_Jsame_nocancel, sj: same, om: '0.3', cz: '0', g2: '0.02', sq: opp, nu: '0.12', dt: '0.02', tend: '38'}
    defaults:
      run:
        working-directory: numerical_minimization/protect3d_Z
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: numerical_minimization/protect3d_Z/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt scipy
      - name: Relaxe un noeud isole (N=48)
        env:
          N: '48'
        run: python jauge.py relax ${{ matrix.nu }} relaxed.npy
      - name: Paire (N=96, separation 20)
        env:
          N: '96'
          SEPC: '20'
          REXT: '22'
          RELAXED: relaxed.npy
          DT: ${{ matrix.dt }}
          CANCEL_PZ: ${{ matrix.cz }}
        run: python jauge.py pair ${{ matrix.nu }} ${{ matrix.g2 }} ${{ matrix.om }} ${{ matrix.tend }} ${{ matrix.tag }} ${{ matrix.sq }} ${{ matrix.sj }} | tee ${{ matrix.tag }}.log
      - name: Archive le journal dans resultats/part184
        if: always()
        working-directory: .
        run: |
          mkdir -p resultats/part184/gh_part184h
          cp numerical_minimization/protect3d_Z/${{ matrix.tag }}.log numerical_minimization/protect3d_Z/${{ matrix.tag }}_proj.npy resultats/part184/gh_part184h/ || true
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add resultats/part184/gh_part184h
          git commit -m "part184h paire ${{ matrix.tag }} : journal

          Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_012qTVdBcwjjMSGxvefBTrWg" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && break || sleep $((RANDOM % 20 + 5)); done
