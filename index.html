<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onde Hélirotoïdale 3D - v1.7.0</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #0d1117; color: #c9d1d9; overflow: hidden; height: 100vh; width: 100vw; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        #ui-panel { position: absolute; top: 15px; left: 15px; z-index: 10; width: 375px; max-height: calc(100vh - 30px); background: rgba(22, 27, 34, 0.92); backdrop-filter: blur(12px); border: 1px solid rgba(240, 246, 252, 0.12); border-radius: 12px; padding: 18px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5); overflow-y: auto; }
        #ui-panel::-webkit-scrollbar { width: 6px; }
        #ui-panel::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 3px; }

        #readout-panel { position: absolute; top: 15px; right: 15px; z-index: 10; width: 360px; background: rgba(22, 27, 34, 0.92); backdrop-filter: blur(12px); border: 1px solid rgba(240, 246, 252, 0.12); border-radius: 12px; padding: 14px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5); font-family: monospace; font-size: 0.73rem; color: #79c0ff; line-height: 1.5; }

        h1 { font-size: 1.05rem; font-weight: 600; color: #58a6ff; margin-bottom: 4px; }
        p.subtitle { font-size: 0.76rem; color: #8b949e; margin-bottom: 12px; }
        .section-title { font-size: 0.70rem; text-transform: uppercase; letter-spacing: 0.05em; color: #8b949e; margin: 12px 0 6px 0; padding-bottom: 3px; border-bottom: 1px solid rgba(240, 246, 252, 0.1); }
        .control-group { margin-bottom: 8px; }
        .control-group label { display: flex; justify-content: space-between; font-size: 0.79rem; color: #e6edf3; }
        .control-group .val { color: #58a6ff; font-family: monospace; }
        input[type=range] { width: 100%; -webkit-appearance: none; background: rgba(110, 118, 129, 0.3); height: 4px; border-radius: 2px; outline: none; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%; background: #58a6ff; cursor: pointer; }
        .checkbox-group { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; font-size: 0.79rem; }
        .checkbox-group input[type=checkbox] { accent-color: #58a6ff; }
        .btn-row { display: flex; gap: 8px; margin-top: 12px; }
        button { flex: 1; padding: 7px 10px; background: #21262d; border: 1px solid rgba(240, 246, 252, 0.1); color: #c9d1d9; border-radius: 6px; cursor: pointer; font-size: 0.76rem; }
        button.primary { background: #238636; color: #ffffff; }
        button.help-btn { background: #1f6feb; color: #ffffff; }
        .status-alert { color: #f85149; font-weight: bold; }
        .status-ok { color: #3fb950; }
        .highlight-val { color: #ffe08a; font-weight: bold; }
        .highlight-b { color: #7ee787; font-weight: bold; }
        .highlight-spin { color: #d2a8ff; font-weight: bold; }
        .highlight-alpha { color: #79c0ff; font-weight: bold; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="readout-panel">Initialisation...</div>

    <div id="ui-panel">
        <h1>Onde Hélirotoïdale 3D - v1.7.0</h1>
        <p class="subtitle">Calibration Topologique H₂=32 & Notice Théorique.</p>

        <div class="section-title">Géométrie Support</div>
        <div class="control-group">
            <label>Rayon Toroïdal (R) <span class="val" id="val-rTorus">1.49</span></label>
            <input type="range" id="param-rTorus" min="0.80" max="3.00" step="0.01" value="1.49">
        </div>
        <div class="control-group">
            <label>Rayon Poloïdal (r) <span class="val" id="val-rTube">0.58</span></label>
            <input type="range" id="param-rTube" min="0.10" max="1.50" step="0.01" value="0.58">
        </div>

        <div class="section-title">Hélice Secondaire</div>
        <div class="control-group">
            <label>Rayon Hélice (r_hélice) <span class="val" id="val-rHelix">0.82</span></label>
            <input type="range" id="param-rHelix" min="0.05" max="1.50" step="0.01" value="0.82">
        </div>
        <div class="control-group">
            <label>Tours Toroïdaux H₀ <span class="val" id="val-nTor">1</span></label>
            <input type="range" id="param-nTor" min="1" max="23" step="1" value="1">
        </div>
        <div class="control-group">
            <label>Tours Poloïdaux H₁ <span class="val" id="val-nPol">1</span></label>
            <input type="range" id="param-nPol" min="1" max="31" step="1" value="1">
        </div>
        <div class="control-group">
            <label>Pas de l'Hélice H₂ <span class="val" id="val-nHelix">32</span></label>
            <input type="range" id="param-nHelix" min="10" max="300" step="1" value="32">
        </div>
        <div class="control-group">
            <label>Angle de Plongée Central <span class="val" id="val-plungeAngle">0°</span></label>
            <input type="range" id="param-plungeAngle" min="0" max="90" step="1" value="0">
        </div>

        <div class="section-title">Respiration Quantum (Fluctuation)</div>
        <div class="control-group">
            <label>Fréquence Respiration <span class="val" id="val-respFreq">0.4 Hz</span></label>
            <input type="range" id="param-respFreq" min="0.0" max="12.0" step="0.1" value="0.4">
        </div>
        <div class="control-group">
            <label>Amplitude Respiration <span class="val" id="val-respAmp">0.34</span></label>
            <input type="range" id="param-respAmp" min="0.00" max="0.50" step="0.01" value="0.34">
        </div>

        <div class="section-title">Cinématique de l'Onde</div>
        <div class="control-group">
            <label>Vitesse de l'Onde (c) <span class="val" id="val-waveSpeed">2.0</span></label>
            <input type="range" id="param-waveSpeed" min="-8.0" max="8.0" step="0.1" value="2.0">
        </div>
        <div class="control-group">
            <label>Rotation Globale (ω) <span class="val" id="val-omega">0.5 rad/s</span></label>
            <input type="range" id="param-omega" min="-4.0" max="4.0" step="0.1" value="0.5">
        </div>
        <div class="control-group">
            <label>Seuil d'Interférence <span class="val" id="val-threshold">0.18</span></label>
            <input type="range" id="param-threshold" min="0.05" max="0.50" step="0.01" value="0.18">
        </div>

        <div class="section-title">Visualisation des Champs & Courants</div>
        <div class="checkbox-group">
            <label for="chk-spin">Vecteur Spin & Précession</label>
            <input type="checkbox" id="chk-spin" checked>
        </div>
        <div class="checkbox-group">
            <label for="chk-current">Vecteurs Courant Tangent (J)</label>
            <input type="checkbox" id="chk-current" checked>
        </div>
        <div class="checkbox-group">
            <label for="chk-fieldBt">Champ Toroïdal (B_t)</label>
            <input type="checkbox" id="chk-fieldBt" checked>
        </div>
        <div class="checkbox-group">
            <label for="chk-fieldBp">Champ Poloïdal (B_p)</label>
            <input type="checkbox" id="chk-fieldBp" checked>
        </div>
        <div class="checkbox-group">
            <label for="chk-fieldBtot">Champ Biot-Savart Réel (B_tot)</label>
            <input type="checkbox" id="chk-fieldBtot">
        </div>

        <div class="section-title">Structures Géométriques</div>
        <div class="checkbox-group">
            <label for="chk-torus">Tore Support</label>
            <input type="checkbox" id="chk-torus" checked>
        </div>
        <div class="checkbox-group">
            <label for="chk-torusOpaque">Tore Opaque</label>
            <input type="checkbox" id="chk-torusOpaque" checked>
        </div>
        <div class="checkbox-group">
            <label for="chk-axis">Axe Primaire H₁</label>
            <input type="checkbox" id="chk-axis" checked>
        </div>
        <div class="checkbox-group">
            <label for="chk-secondSpire">Double Spire (Halo)</label>
            <input type="checkbox" id="chk-secondSpire" checked>
        </div>
        <div class="checkbox-group">
            <label for="chk-markers">Marqueurs de Spire</label>
            <input type="checkbox" id="chk-markers" checked>
        </div>

        <div class="btn-row">
            <button id="btn-pause" class="primary">Pause</button>
            <button id="btn-reset">Réinitialiser</button>
            <button id="btn-help" class="help-btn">Aide</button>
        </div>
    </div>

    <script>
        const params = {
            rTorus: 1.49, rTube: 0.58, rHelix: 0.82, plungeAngle: 0,
            nTor: 1, nPol: 1, nHelix: 32, threshold: 0.18, waveSpeed: 2.0,
            omega: 0.5, respFreq: 0.4, respAmp: 0.34,
            showSpin: true, showCurrent: true, showBt: true, showBp: true, showBtot: false,
            showTorus: true, opaqueTorus: true, showAxis: true,
            showSecondSpire: true, showMarkers: true, paused: false
        };

        let simTime = 0;
        const TUBE_STEPS = 800;

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0d1117);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5.5, 6.5, 7.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const light1 = new THREE.DirectionalLight(0x58a6ff, 1.2);
        light1.position.set(8, 12, 10);
        scene.add(light1);

        const light2 = new THREE.DirectionalLight(0xff7b72, 0.6);
        light2.position.set(-8, -8, -10);
        scene.add(light2);

        const gridHelper = new THREE.GridHelper(16, 16, 0x30363d, 0x21262d);
        gridHelper.position.y = -2;
        scene.add(gridHelper);

        const mainGroup = new THREE.Group();
        scene.add(mainGroup);

        let torusMesh, helixMesh, secondHelixMesh, primaryAxisMesh, tubeGeometry, secondTubeGeometry, markersInstancedMesh;
        let currentVectorsGroup, btLinesGroup, bpLinesGroup, btotLinesGroup, spinGroup;

        const dummyMatrix = new THREE.Matrix4();

        function getBreathingFactor() {
            if (params.respAmp === 0 || params.respFreq === 0) return 0;
            return Math.sin(simTime * params.respFreq * Math.PI * 2);
        }

        function getHelixCenterPoint(t) {
            const phi = t * params.nTor * 2 * Math.PI;
            const theta = t * params.nPol * 2 * Math.PI;

            const cosPhi = Math.cos(phi);
            const sinPhi = Math.sin(phi);
            const cosTheta = Math.cos(theta);
            const sinTheta = Math.sin(theta);

            const breath = getBreathingFactor() * params.respAmp;
            const maxAllowedHelixRadius = Math.max(0.05, params.rTorus);
            const dynamicHelixRadius = Math.min(params.rHelix * (1 + breath * 0.4), maxAllowedHelixRadius);

            const poloidDistance = params.rTube + dynamicHelixRadius + (breath * 0.2);

            const rawHole = Math.max(0, -cosTheta);
            const holeFactor = Math.pow(rawHole, 2);

            const currentR = (params.rTorus + poloidDistance * cosTheta) * (1 - holeFactor);
            
            const center = new THREE.Vector3(
                currentR * cosPhi,
                poloidDistance * sinTheta,
                currentR * sinPhi
            );

            const Radial = new THREE.Vector3(cosPhi, 0, sinPhi);

            return {
                center, phi, theta, cosTheta, sinTheta, Radial, holeFactor, poloidDistance, dynamicHelixRadius, breath
            };
        }

        function getDoubleHelixPoint(t, wavePhase, isSecondSpire = false) {
            const cData = getHelixCenterPoint(t);
            const helixCenter = cData.center;
            const Up = new THREE.Vector3(0, 1, 0);

            const dt = 0.0001;
            const pNext = getHelixCenterPoint(t + dt).center;
            const pPrev = getHelixCenterPoint(t - dt).center;
            const realTangent = pNext.clone().sub(pPrev).normalize();

            let E1 = cData.Radial.clone().projectOnPlane(realTangent).normalize();
            
            const plungeRad = (params.plungeAngle * Math.PI / 180) * cData.holeFactor;
            E1.lerp(Up, Math.sin(plungeRad)).normalize();
            
            let E2 = new THREE.Vector3().crossVectors(realTangent, E1).normalize();

            const spireOffset = isSecondSpire ? 0.35 + (cData.breath * 0.15) : 0;
            const psi = t * params.nHelix * 2 * Math.PI - wavePhase + spireOffset;
            const cosPsi = Math.cos(psi);
            const sinPsi = Math.sin(psi);

            const effectiveRadius = isSecondSpire ? 
                cData.dynamicHelixRadius * (1.08 + cData.breath * 0.12) : 
                cData.dynamicHelixRadius;

            return new THREE.Vector3(
                helixCenter.x + effectiveRadius * (cosPsi * E1.x + sinPsi * E2.x),
                helixCenter.y + effectiveRadius * (cosPsi * E1.y + sinPsi * E2.y),
                helixCenter.z + effectiveRadius * (cosPsi * E1.z + sinPsi * E2.z)
            );
        }

        function computeBiotSavartField(targetPos, curvePoints, I_eff) {
            const B = new THREE.Vector3(0, 0, 0);
            const numSegments = curvePoints.length - 1;
            const epsilonSq = 0.026 * 0.026;

            for (let i = 0; i < numSegments; i++) {
                const p1 = curvePoints[i];
                const p2 = curvePoints[i + 1];
                
                const dL = p2.clone().sub(p1);
                const pMid = p1.clone().add(p2).multiplyScalar(0.5);
                const rVec = targetPos.clone().sub(pMid);
                const distSq = rVec.lengthSq() + epsilonSq;
                const distCube = Math.pow(distSq, 1.5);

                const crossProd = dL.clone().cross(rVec);
                crossProd.multiplyScalar(I_eff / distCube);
                B.add(crossProd);
            }
            return B;
        }

        function computeMagneticDipoleMoment(curvePoints, I_eff) {
            const mu = new THREE.Vector3(0, 0, 0);
            const numSegments = curvePoints.length - 1;

            for (let i = 0; i < numSegments; i++) {
                const p1 = curvePoints[i];
                const p2 = curvePoints[i + 1];
                const dL = p2.clone().sub(p1);
                const pMid = p1.clone().add(p2).multiplyScalar(0.5);

                const crossProd = pMid.clone().cross(dL);
                mu.add(crossProd);
            }
            return mu.multiplyScalar(0.5 * I_eff);
        }

        function buildSpinVisuals() {
            if (spinGroup) mainGroup.remove(spinGroup);
            spinGroup = new THREE.Group();
            mainGroup.add(spinGroup);

            if (!params.showSpin) return;

            const spinDirection = params.waveSpeed >= 0 ? 1 : -1;
            const arrowDir = new THREE.Vector3(0, spinDirection, 0);
            const arrowOrigin = new THREE.Vector3(0, -spinDirection * 1.2, 0);

            const spinArrow = new THREE.ArrowHelper(
                arrowDir, arrowOrigin, 2.4, 0xd2a8ff, 0.35, 0.20
            );
            spinGroup.add(spinArrow);

            const ringRadius = Math.max(0.3, (params.rTorus - params.rTube) * 0.6);
            const ringPoints = [];
            const steps = 60;
            for (let i = 0; i <= steps; i++) {
                const a = (i / steps) * Math.PI * 2;
                ringPoints.push(new THREE.Vector3(ringRadius * Math.cos(a), 0, ringRadius * Math.sin(a)));
            }
            const ringGeom = new THREE.BufferGeometry().setFromPoints(ringPoints);
            const ringMat = new THREE.LineBasicMaterial({ color: 0xd2a8ff, transparent: true, opacity: 0.85, linewidth: 2 });
            const ringLine = new THREE.Line(ringGeom, ringMat);
            spinGroup.add(ringLine);

            const precAngle = (simTime * params.omega * spinDirection) % (Math.PI * 2);
            const precPos = new THREE.Vector3(ringRadius * Math.cos(precAngle), 0, ringRadius * Math.sin(precAngle));
            const precTangent = new THREE.Vector3(-ringRadius * Math.sin(precAngle) * spinDirection, 0, ringRadius * Math.cos(precAngle) * spinDirection).normalize();

            const precArrow = new THREE.ArrowHelper(
                precTangent, precPos, 0.4, 0xf08c00, 0.12, 0.08
            );
            spinGroup.add(precArrow);
        }

        function buildFieldAndCurrentVisuals() {
            if (currentVectorsGroup) mainGroup.remove(currentVectorsGroup);
            if (btLinesGroup) mainGroup.remove(btLinesGroup);
            if (bpLinesGroup) mainGroup.remove(bpLinesGroup);
            if (btotLinesGroup) mainGroup.remove(btotLinesGroup);

            currentVectorsGroup = new THREE.Group();
            btLinesGroup = new THREE.Group();
            bpLinesGroup = new THREE.Group();
            btotLinesGroup = new THREE.Group();

            mainGroup.add(currentVectorsGroup);
            mainGroup.add(btLinesGroup);
            mainGroup.add(bpLinesGroup);
            mainGroup.add(btotLinesGroup);

            if (params.showBt) {
                const numRings = 8;
                for (let r = 0; r < numRings; r++) {
                    const radiusOffset = (r / (numRings - 1) - 0.5) * params.rTube * 1.4;
                    const ringRadius = params.rTorus + radiusOffset;
                    const points = [];
                    const steps = 120;
                    for (let i = 0; i <= steps; i++) {
                        const a = (i / steps) * Math.PI * 2;
                        points.push(new THREE.Vector3(ringRadius * Math.cos(a), 0, ringRadius * Math.sin(a)));
                    }
                    const geom = new THREE.BufferGeometry().setFromPoints(points);
                    const mat = new THREE.LineBasicMaterial({ color: 0xffe08a, transparent: true, opacity: 0.85, linewidth: 2 });
                    btLinesGroup.add(new THREE.Line(geom, mat));
                }
            }

            if (params.showBp) {
                const numSections = 16;
                for (let s = 0; s < numSections; s++) {
                    const phi = (s / numSections) * Math.PI * 2;
                    const centerR = params.rTorus;

                    const ringPoints = [];
                    const steps = 50;
                    for (let i = 0; i <= steps; i++) {
                        const theta = (i / steps) * Math.PI * 2;
                        const pr = params.rTube * 1.25;
                        const x = (centerR + pr * Math.cos(theta)) * Math.cos(phi);
                        const y = pr * Math.sin(theta);
                        const z = (centerR + pr * Math.cos(theta)) * Math.sin(phi);
                        ringPoints.push(new THREE.Vector3(x, y, z));
                    }
                    const geom = new THREE.BufferGeometry().setFromPoints(ringPoints);
                    const mat = new THREE.LineBasicMaterial({ color: 0xff6b6b, transparent: true, opacity: 0.6 });
                    bpLinesGroup.add(new THREE.Line(geom, mat));
                }
            }

            if (params.showCurrent) {
                const numArrows = 24;
                for (let a = 0; a < numArrows; a++) {
                    const arrowHelper = new THREE.ArrowHelper(
                        new THREE.Vector3(1, 0, 0), new THREE.Vector3(0, 0, 0),
                        0.45, 0x00f0ff, 0.15, 0.08
                    );
                    currentVectorsGroup.add(arrowHelper);
                }
            }

            if (params.showBtot) {
                const numGridRings = 8;
                const numGridSec = 12;
                for (let r = 0; r < numGridRings; r++) {
                    const phi = (r / numGridRings) * Math.PI * 2;
                    for (let s = 0; s < numGridSec; s++) {
                        const theta = (s / numGridSec) * Math.PI * 2;
                        const pr = params.rTube * 1.4;
                        const cx = (params.rTorus + pr * Math.cos(theta)) * Math.cos(phi);
                        const cy = pr * Math.sin(theta);
                        const cz = (params.rTorus + pr * Math.cos(theta)) * Math.sin(phi);

                        const arrowHelper = new THREE.ArrowHelper(
                            new THREE.Vector3(0, 1, 0),
                            new THREE.Vector3(cx, cy, cz),
                            0.3, 0x51cf66, 0.08, 0.05
                        );
                        btotLinesGroup.add(arrowHelper);
                    }
                }
            }
        }

        function updateSimulationGeometry() {
            if (torusMesh) mainGroup.remove(torusMesh);
            if (helixMesh) mainGroup.remove(helixMesh);
            if (secondHelixMesh) mainGroup.remove(secondHelixMesh);
            if (primaryAxisMesh) mainGroup.remove(primaryAxisMesh);
            if (markersInstancedMesh) mainGroup.remove(markersInstancedMesh);

            if (params.showTorus) {
                const torusGeom = new THREE.TorusGeometry(params.rTorus, params.rTube, 32, 80);
                const torusMat = params.opaqueTorus ? 
                    new THREE.MeshStandardMaterial({ color: 0x1f242d, roughness: 0.6, metalness: 0.2 }) :
                    new THREE.MeshStandardMaterial({ color: 0x8b949e, wireframe: true, transparent: true, opacity: 0.12 });

                torusMesh = new THREE.Mesh(torusGeom, torusMat);
                torusMesh.rotation.x = Math.PI / 2;
                mainGroup.add(torusMesh);
            }

            if (params.showAxis) {
                const axisPoints = [];
                for (let i = 0; i <= 600; i++) {
                    const cData = getHelixCenterPoint(i / 600);
                    axisPoints.push(cData.center);
                }
                const axisGeom = new THREE.BufferGeometry().setFromPoints(axisPoints);
                const axisMat = new THREE.LineDashedMaterial({ color: 0xffffff, dashSize: 0.08, gapSize: 0.04, opacity: 0.9, transparent: true });
                primaryAxisMesh = new THREE.Line(axisGeom, axisMat);
                primaryAxisMesh.computeLineDistances();
                mainGroup.add(primaryAxisMesh);
            }

            const curvePoints = [];
            for (let i = 0; i <= TUBE_STEPS; i++) {
                curvePoints.push(getDoubleHelixPoint(i / TUBE_STEPS, 0, false));
            }

            class DynamicCurve extends THREE.Curve {
                constructor(pts) { super(); this.pts = pts; }
                getPoint(t) {
                    const idx = Math.min(Math.floor(t * TUBE_STEPS), TUBE_STEPS - 1);
                    return this.pts[idx];
                }
            }

            tubeGeometry = new THREE.TubeGeometry(new DynamicCurve(curvePoints), TUBE_STEPS, 0.026, 8, false);
            const countVertices = tubeGeometry.attributes.position.count;
            const colors = new Float32Array(countVertices * 3);
            for (let i = 0; i < countVertices; i++) {
                colors[i * 3] = 0.22; colors[i * 3 + 1] = 0.55; colors[i * 3 + 2] = 0.98;
            }
            tubeGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const tubeMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.25, metalness: 0.5 });
            helixMesh = new THREE.Mesh(tubeGeometry, tubeMat);
            mainGroup.add(helixMesh);

            if (params.showSecondSpire) {
                const secondCurvePoints = [];
                for (let i = 0; i <= TUBE_STEPS; i++) {
                    secondCurvePoints.push(getDoubleHelixPoint(i / TUBE_STEPS, 0, true));
                }
                secondTubeGeometry = new THREE.TubeGeometry(new DynamicCurve(secondCurvePoints), TUBE_STEPS, 0.009, 6, false);
                const secondTubeMat = new THREE.MeshBasicMaterial({ color: 0xffe08a, transparent: true, opacity: 0.75 });
                secondHelixMesh = new THREE.Mesh(secondTubeGeometry, secondTubeMat);
                mainGroup.add(secondHelixMesh);
            }

            if (params.showMarkers) {
                const markerGeom = new THREE.SphereGeometry(0.042, 12, 12);
                const markerMat = new THREE.MeshStandardMaterial({ color: 0xffa657, emissive: 0xd97706, roughness: 0.2, metalness: 0.8 });
                markersInstancedMesh = new THREE.InstancedMesh(markerGeom, markerMat, params.nHelix);
                mainGroup.add(markersInstancedMesh);
            }

            buildFieldAndCurrentVisuals();
            buildSpinVisuals();
        }

        function detectInterferences(curvePoints) {
            const minIndexDistance = Math.floor(TUBE_STEPS / params.nHelix * 1.5);
            const sqThresh = params.threshold * params.threshold;
            const isInterfering = new Array(TUBE_STEPS + 1).fill(false);
            let collisionCount = 0;

            for (let i = 0; i <= TUBE_STEPS; i++) {
                for (let j = i + minIndexDistance; j <= TUBE_STEPS; j++) {
                    if (curvePoints[i].distanceToSquared(curvePoints[j]) < sqThresh) {
                        isInterfering[i] = true;
                        isInterfering[j] = true;
                        collisionCount++;
                    }
                }
            }
            return { isInterfering, collisionCount };
        }

        function animateWave() {
            if (!tubeGeometry || !tubeGeometry.attributes.position) return;

            const wavePhase = simTime * params.waveSpeed;
            const posAttr = tubeGeometry.attributes.position;
            const colorAttr = tubeGeometry.attributes.color;

            const curvePoints = [];
            for (let i = 0; i <= TUBE_STEPS; i++) {
                curvePoints.push(getDoubleHelixPoint(i / TUBE_STEPS, wavePhase, false));
            }

            const { isInterfering, collisionCount } = detectInterferences(curvePoints);
            const radialSegments = 8;
            const tubeRadius = 0.026;

            for (let i = 0; i <= TUBE_STEPS; i++) {
                const p = curvePoints[i];
                const pNext = curvePoints[Math.min(i + 1, TUBE_STEPS)];
                const T = pNext.clone().sub(p).normalize();

                let up = Math.abs(T.y) > 0.9 ? new THREE.Vector3(1, 0, 0) : new THREE.Vector3(0, 1, 0);
                let N = new THREE.Vector3().crossVectors(up, T).normalize();
                let B = new THREE.Vector3().crossVectors(T, N).normalize();

                const inRed = isInterfering[i];
                const rCol = inRed ? 1.0 : 0.22;
                const gCol = inRed ? 0.15 : 0.55;
                const bCol = inRed ? 0.15 : 0.98;

                for (let j = 0; j <= radialSegments; j++) {
                    const vIndex = i * (radialSegments + 1) + j;
                    const rad = (j / radialSegments) * 2 * Math.PI;
                    const cx = -tubeRadius * Math.cos(rad);
                    const cy = tubeRadius * Math.sin(rad);

                    posAttr.setXYZ(vIndex, p.x + cx * N.x + cy * B.x, p.y + cx * N.y + cy * B.y, p.z + cx * N.z + cy * B.z);
                    colorAttr.setXYZ(vIndex, rCol, gCol, bCol);
                }
            }

            posAttr.needsUpdate = true;
            colorAttr.needsUpdate = true;
            tubeGeometry.computeVertexNormals();

            const effCurrent = Math.abs(params.waveSpeed * params.nHelix * 0.05);

            if (params.showCurrent && currentVectorsGroup) {
                const arrows = currentVectorsGroup.children;
                const numArrows = arrows.length;
                for (let a = 0; a < numArrows; a++) {
                    const idx = Math.floor((a / numArrows) * TUBE_STEPS);
                    const p1 = curvePoints[idx];
                    const p2 = curvePoints[Math.min(idx + 1, TUBE_STEPS)];
                    const dir = p2.clone().sub(p1).normalize();
                    arrows[a].position.copy(p1);
                    arrows[a].setDirection(dir);
                }
            }

            if (params.showBtot && btotLinesGroup) {
                const arrows = btotLinesGroup.children;
                const numArrows = arrows.length;
                const sampledPoints = [];
                for (let k = 0; k <= 120; k++) {
                    sampledPoints.push(curvePoints[Math.floor((k / 120) * TUBE_STEPS)]);
                }

                for (let a = 0; a < numArrows; a++) {
                    const arrow = arrows[a];
                    const bVec = computeBiotSavartField(arrow.position, sampledPoints, effCurrent);
                    const bMag = bVec.length();
                    if (bMag > 0.0001) {
                        arrow.setDirection(bVec.normalize());
                        arrow.setLength(Math.min(0.45, bMag * 0.8), 0.08, 0.05);
                    }
                }
            }

            if (params.showSecondSpire && secondTubeGeometry && secondTubeGeometry.attributes.position) {
                const sPosAttr = secondTubeGeometry.attributes.position;
                const sCurvePoints = [];
                for (let i = 0; i <= TUBE_STEPS; i++) {
                    sCurvePoints.push(getDoubleHelixPoint(i / TUBE_STEPS, wavePhase, true));
                }
                const sRadialSegments = 6;
                const sTubeRadius = 0.009;

                for (let i = 0; i <= TUBE_STEPS; i++) {
                    const p = sCurvePoints[i];
                    const pNext = sCurvePoints[Math.min(i + 1, TUBE_STEPS)];
                    const T = pNext.clone().sub(p).normalize();

                    let up = Math.abs(T.y) > 0.9 ? new THREE.Vector3(1, 0, 0) : new THREE.Vector3(0, 1, 0);
                    let N = new THREE.Vector3().crossVectors(up, T).normalize();
                    let B = new THREE.Vector3().crossVectors(T, N).normalize();

                    for (let j = 0; j <= sRadialSegments; j++) {
                        const vIndex = i * (sRadialSegments + 1) + j;
                        const rad = (j / sRadialSegments) * 2 * Math.PI;
                        const cx = -sTubeRadius * Math.cos(rad);
                        const cy = sTubeRadius * Math.sin(rad);

                        sPosAttr.setXYZ(vIndex, p.x + cx * N.x + cy * B.x, p.y + cx * N.y + cy * B.y, p.z + cx * N.z + cy * B.z);
                    }
                }
                sPosAttr.needsUpdate = true;
                secondTubeGeometry.computeVertexNormals();
            }

            if (params.showAxis && primaryAxisMesh) {
                const axisPositions = primaryAxisMesh.geometry.attributes.position;
                for (let i = 0; i <= 600; i++) {
                    const cData = getHelixCenterPoint(i / 600);
                    axisPositions.setXYZ(i, cData.center.x, cData.center.y, cData.center.z);
                }
                axisPositions.needsUpdate = true;
                primaryAxisMesh.computeLineDistances();
            }

            if (params.showMarkers && markersInstancedMesh) {
                for (let k = 0; k < params.nHelix; k++) {
                    dummyMatrix.setPosition(getDoubleHelixPoint(k / params.nHelix, wavePhase, false));
                    markersInstancedMesh.setMatrixAt(k, dummyMatrix);
                }
                markersInstancedMesh.instanceMatrix.needsUpdate = true;
            }

            if (params.showSpin) {
                buildSpinVisuals();
            }

            mainGroup.rotation.y = simTime * params.omega;

            const holeRadius = Math.max(0, params.rTorus - params.rTube).toFixed(2);
            const breathVal = getBreathingFactor() * params.respAmp;
            
            const baseMass = 0.510998;
            const hypervolumeLoss = Math.pow(Math.abs(breathVal), 1.5) * 0.045;
            const calculatedMass = (baseMass * (1 - hypervolumeLoss)).toFixed(6);

            const pureHypervolume = 4 * Math.pow(Math.PI, 3) + Math.pow(Math.PI, 2) + Math.PI;
            const codataAlphaInv = 137.03599918;
            const deltaCodata = pureHypervolume - codataAlphaInv;
            
            const alphaInvVal = codataAlphaInv - (breathVal / 0.34) * deltaCodata;
            const alphaInvCalculated = alphaInvVal.toFixed(4);
            const alphaValCalculated = (1 / alphaInvVal).toFixed(6);

            const sampledDipolePoints = [];
            for (let k = 0; k <= 100; k++) {
                sampledDipolePoints.push(curvePoints[Math.floor((k / 100) * TUBE_STEPS)]);
            }
            const magneticDipole = computeMagneticDipoleMoment(sampledDipolePoints, effCurrent);

            const helixAngleRad = Math.atan2(params.rTube * params.nPol, params.rTorus * params.nTor);
            const J_toroidal = (effCurrent * Math.cos(helixAngleRad)).toFixed(3);
            const J_poloidal = (effCurrent * Math.sin(helixAngleRad)).toFixed(3);

            const spinValText = params.waveSpeed >= 0 ? "+1/2 (Up ℏ)" : "-1/2 (Down ℏ)";
            const statusClass = collisionCount > 0 ? "status-alert" : "status-ok";
            const statusText = collisionCount > 0 ? "INTERFÉRENCES" : "FLUIDE";

            document.getElementById('readout-panel').innerHTML =
                `Trou central : ${holeRadius} u | État : <span class="${statusClass}">${statusText}</span><br>` +
                `Spin Quantique (Axial) : <span class="highlight-spin">${spinValText}</span><br>` +
                `Respiration : <span class="highlight-val">${(breathVal >= 0 ? '+' : '')}${breathVal.toFixed(4)} u</span> (${params.respFreq} Hz)<br>` +
                `Masse calculée : <span class="highlight-val">${calculatedMass} MeV/c²</span><br>` +
                `Constante α⁻¹ : <span class="highlight-alpha">${alphaInvCalculated}</span> (α = ${alphaValCalculated})<br>` +
                `Moment dipolaire μ_z (BS) : <span class="highlight-b">${magneticDipole.y >= 0 ? '+' : ''}${magneticDipole.y.toFixed(3)} μ_B</span><br>` +
                `Courant J_eff : ${effCurrent.toFixed(3)} u.a. (J_t = ${J_toroidal} | J_p = ${J_poloidal})<br>` +
                `Proximités (< ${params.threshold.toFixed(2)} u) : ${collisionCount}`;
        }

        document.getElementById('btn-help').addEventListener('click', () => {
            const helpWindow = window.open('', '_blank');

                <!DOCTYPE html>
                <html lang="fr">
                <head>
                    <meta charset="UTF-8">
                    <title>Guide d'utilisation - Onde Hélirotoïdale 3D</title>
                    <style>
                        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0d1117; color: #c9d1d9; padding: 40px; line-height: 1.6; max-width: 820px; margin: auto; }
                        h1 { color: #58a6ff; border-bottom: 1px solid #30363d; padding-bottom: 10px; margin-bottom: 20px; }

                    </style>
                </head>
                <body>
                    <h1>Notice Théorique et Guide — Simulation 3D (v1.7.0)</h1>
                    
                    <h2>1. Affichage du Tore Opaque & Champs</h2>
                    <p>Pour que l'option <strong>Tore Opaque</strong> fonctionne, la case <strong>Tore Support</strong> doit être cochée. Le Champ Toroïdal (<code>B_t</code>) circule au cœur du tore : pour le voir distinctement, désactivez l'opacité du tore.</p>

                    <h2>2. Cinématique de l'Onde et Vecteurs Courant</h2>
                    <p>Le paramètre <strong>Vitesse de l'Onde (c)</strong> pilote la vitesse de phase. Passer à une vitesse négative inverse la direction de propagation de la déformation de l'onde tout en préservant l'orientation géométrique intrinsèque du courant.</p>

                    <h2>3. Spin Quantique et Précession</h2>
                    <p>Le vecteur axial central indique l'orientation du Spin (<code>+1/2</code> ou <code>-1/2</code>) selon la direction de propagation de l'onde. L'anneau équatorial visualise la précession de phase.</p>

                    <h2>4. Quantification Topologique des Enroulements (H₀, H₁, H₂)</h2>
                    <div class="highlight-box">
                        <p><strong>A. Ratio H₁ / H₀ (Topologie du tore support) :</strong><br>
                        Détermine la trajectoire du cœur du tube (le nœud torique principal).</p>
                        <ul>
                            <li><strong>Fermeture C⁰ (courbe fermée) :</strong> <code>H₁ / H₀ &in; &mathbb;Q</code> (rationnel strict). Si le ratio est irrationnel (&pi;, &radic;2), la ligne ne se referme jamais et remplit le tore de façon dense (onde ouverte ergodique).</li>
                            <li><strong>Brin unique (gcd(H₀, H₁) = 1) :</strong> Pour que le vortex soit constitué d'un seul fil continu :
                                <ul>
                                    <li><code>H₀ = 1, H₁ = 1</code> : Cas fondamental de l'électron PEW (spire toroïdale simple).</li>
                                    <li><code>H₀ = 1, H₁ = 2</code> ou <code>H₀ = 2, H₁ = 3</code> : Trajectoires entrelacées (nœud de trèfle / tresses B₃ associées aux structures hadroniques/quarks).</li>
                                </ul>
                            </li>
                        </ul>

                        <p><strong>B. Paramètre H₂ (Nombre de spires de l'hélice secondaire) :</strong><br>
                        Nombre de rotations de l'hélice autour du tube support sur un cycle complet.</p>
                        <ul>
                            <li><strong>Fermeture de position (C⁰) :</strong> <code>H₂ &in; &mathbb;N*</code> (entier naturel strict). Une fraction (ex. 30.3) empêche la jonction des extrémités à <code>t = 0 &rarr; 1</code>.</li>
                            <li><strong>Fermeture de tangente sans pincement (C¹) :</strong> Pour absorber le vrillage du repère mobile de Frenet et la phase géométrique de Berry, H₂ doit s'accorder selon la règle :<br>
                            <code>H₂ = k &middot; (H₀ + H₁)</code> avec <code>k &in; &mathbb;N*</code>.<br>
                            En configuration <code>1/1</code>, les valeurs idéalement lisses sont les multiples pairs (ex. <code>H₂ = 32</code> avec k = 16).</li>
                        </ul>

                        <p><strong>C. Combinaisons de Chiralité (&chi;₀, &chi;₁, &chi;₂) :</strong><br>
                        Chaque paramètre peut prendre un signe positivement ou négativement (&plusmn;H<sub>i</sub>), générant 2³ = 8 combinaisons topologiques :</p>
                        <ul>
                            <li><code>Signe(H₀ &middot; H₁ &middot; H₂) = +1</code> : Particule (ex. électron dextrogyre).</li>
                            <li><code>Signe(H₀ &middot; H₁ &middot; H₂) = -1</code> : Antiparticule (ex. positron lévogyre).</li>
                        </ul>
                    </div>

                    <h2>5. Respiration et Constante de Couplage (α⁻¹)</h2>
                    <p>Au point d'équilibre central (<code>&Delta;r = 0</code>), la constante de couplage est exactement centrée sur la valeur CODATA <code>137.0359</code>. L'amplitude par défaut fixée à <code>0.34</code> fait osciller la valeur entre l'hypervolume pur (<code>137.0363</code>) et le seuil d'expansion (<code>137.0357</code>).</p>

                    <h2>6. Paramètres de Référence Géométrique</h2>
                    <table>
                        <tr><th>Paramètre</th><th>Valeur nominale</th><th>Rôle</th></tr>
                        <tr><td>Sphère Centrale (r_sphère)</td><td>0.91 u</td><td>Unité de référence centrale</td></tr>
                        <tr><td>Grand Rayon (R_tore)</td><td>1.49 u</td><td>Distance axe - cœur du tube</td></tr>
                        <tr><td>Rayon du tube (r_tube)</td><td>0.58 u</td><td>Confinement du tore</td></tr>
                        <tr><td>Rayon hélice (r_hélice)</td><td>0.82 u</td><td>Rayon dynamique de l'hélice</td></tr>
                    </table>

                    <h2>7. Zone de Jonction (Point de Friction)</h2>
                    <p>L'amincissement ou la coloration rouge d'un segment de l'hélice signale le point de fermeture topologique de la boucle (<code>t = 0 &rarr; 1</code>), marquant le nœud de tension de phase sous le seuil d'interférence.</p>
                </body>
